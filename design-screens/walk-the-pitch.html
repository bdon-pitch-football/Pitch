<title>Walk the Pitch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&display=swap">
<style>
  :root{
    --bg:#0b120e; --panel:#121b16; --panel2:#1a2420; --line:#24322a;
    --ink:#eef5f0; --sec:#b9c8bf; --mut:#7d8f85; --acc:#3ddc84;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;
       -webkit-font-smoothing:antialiased;overflow:hidden}
  #app{display:flex;height:100vh;height:100dvh}

  /* ---------- rail ---------- */
  aside{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
        display:flex;flex-direction:column;overflow:hidden}
  .brand{padding:20px 18px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
  .brand h1{font-size:16px;font-weight:900;letter-spacing:-.02em;margin:0}
  .brand p{font-size:11.5px;color:var(--mut);margin:0;font-weight:700}
  .pgroup{padding:14px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
  .plabel{font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);padding:0 6px 4px}
  .pbtn{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;border:1px solid transparent;
        background:none;color:var(--sec);font:inherit;font-size:13px;font-weight:700;cursor:pointer;text-align:left;width:100%}
  .pbtn:hover{background:var(--panel2);color:var(--ink)}
  .pbtn[aria-current="true"]{background:var(--panel2);border-color:var(--line);color:var(--ink)}
  .dot{width:8px;height:8px;border-radius:99px;flex-shrink:0}
  .pbtn .cnt{margin-left:auto;font-size:11px;color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums}
  .steps{flex:1;overflow-y:auto;padding:12px 12px 24px;display:flex;flex-direction:column;gap:2px}
  .sbtn{display:flex;gap:9px;padding:8px 10px;border-radius:8px;border:none;background:none;color:var(--sec);
        font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;text-align:left;width:100%;line-height:1.35}
  .sbtn:hover{background:var(--panel2);color:var(--ink)}
  .sbtn[aria-current="true"]{background:var(--acc);color:#06130c;font-weight:800}
  .sbtn .i{flex-shrink:0;opacity:.6;font-variant-numeric:tabular-nums;min-width:16px}
  .sbtn[aria-current="true"] .i{opacity:.85}

  /* ---------- stage ---------- */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  .bar{height:56px;flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;
       gap:14px;padding:0 18px;background:var(--panel)}
  .bar .t{font-size:13.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .who{font-size:11.5px;color:var(--mut);font-weight:700;white-space:nowrap}
  .nav{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
  .nb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--sec);
      font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
  .nb:hover:not(:disabled){color:var(--ink);border-color:var(--acc)}
  .nb:disabled{opacity:.3;cursor:default}
  .pos{font-size:12px;color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}

  .stage{flex:1;overflow-y:auto;overflow-x:auto;display:flex;justify-content:center;padding:34px 24px 60px;background:
    radial-gradient(1100px 520px at 50% -10%, rgba(61,220,132,.05), transparent 65%), var(--bg)}
  .phone{flex-shrink:0;width:390px;border-radius:26px;overflow:hidden;border:1px solid var(--line);
         box-shadow:0 22px 60px rgba(0,0,0,.5);background:#0b120e;height:max-content}
  .wide{width:auto;border-radius:14px}

  .hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-size:11.5px;color:var(--mut);
        background:var(--panel);border:1px solid var(--line);padding:7px 13px;border-radius:99px;font-weight:700;
        pointer-events:none}
  kbd{font-family:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;
      font-size:10.5px;color:var(--sec)}
  @media (max-width:820px){ aside{display:none} .stage{padding:18px 10px 50px} }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
</style>

<div id="app">
  <aside>
    <div class="brand"><h1>Walk the Pitch</h1><p>Phase 1 · every screen · demo data</p></div>
    <div class="pgroup"><div class="plabel">Whose seat</div><div id="personas"></div></div>
    <div class="steps" id="steps"></div>
  </aside>
  <main>
    <div class="bar">
      <div class="t" id="stitle">—</div>
      <div class="who" id="swho"></div>
      <div class="nav">
        <button class="nb" id="prev" aria-label="Previous screen">&#8249;</button>
        <div class="pos" id="pos">1 / 1</div>
        <button class="nb" id="next" aria-label="Next screen">&#8250;</button>
      </div>
    </div>
    <div class="stage" id="stage"></div>
  </main>
</div>
<div class="hint"><kbd>&#8592;</kbd> <kbd>&#8594;</kbd> screens &nbsp;·&nbsp; <kbd>1</kbd>&#8211;<kbd>5</kbd> personas</div>

x-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Wrong number? You can change it while you wait.</div></div>\n  </div>\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 10px;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7.5 v5\"></path><circle cx=\"12\" cy=\"16.2\" r=\"0.6\" fill=\"#7d8f85\"></circle></svg><div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">Put in your own number and nothing happens &mdash; the approval has to come from an adult&rsquo;s own phone, and we check the two are different.</div></div>\n  <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Ask them to approve it</div>\n  <div style=\"display: flex; align-items: center; justify-content: center; color: #7d8f85; font-weight: 700; font-size: 14px; height: 44px;\">Why does a parent have to do this?</div>\n\n</div>", "title": "6 · Who should we ask to approve?", "w": 390}, "WaitingForParent": {"html": "<div style=\"width: 390px; min-height: 1210px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8 d: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; justify-content: space-between;\">\n      <div style=\"font-size: 15px; color: #eef5f0; font-weight: 700;\">U15 Boys</div>\n      <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9 l6 6 l6 -6\"></path></svg>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Where you'd play</div>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n      <div style=\"background: #3ddc84; color: #06130c; border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 900;\">AM</div>\n      <div style=\"background: #3ddc84; color: #06130c; border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 900;\">LW</div>\n      <div style=\"border: 1px solid #24322a; color: #7d8f85; border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 700;\">CM</div>\n      <div style=\"border: 1px solid #24322a; color: #7d8f85; border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 700;\">RW</div>\n      <div style=\"border: 1px solid #24322a; color: #7d8f85; border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 700;\">ST</div>\n    </div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Filled in from your CV. Change it if you'd play somewhere else for this club.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 8px;\">\n      <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">One line, if you want</div>\n      <div style=\"font-size: 11px; font-weight: 700; color: #7d8f85;\">51 / 140</div>\n    </div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; min-height: 62px;\">\n      <div style=\"font-size: 13.5px; color: #eef5f0; font-weight: 500; line-height: 1.5;\">Right-footed 10. Happy anywhere across the front three.</div>\n    </div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Football only. Your parent reads this before it goes anywhere.</div>\n  </div>\n\n  <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 11px;\">\n    <div style=\"font-size: 13.5px; font-weight: 800; color: #eef5f0;\">What the club gets</div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">A link to your CV — the live page, not a copy of it.</div>\n    </div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Your name, your age, your club, the squad, where you&rsquo;d play, and your one line &mdash; what a coach picks a squad on.</div>\n    </div>\n    <div style=\"height: 1px; background: #24322a;\"></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e34948\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M6 6 L18 18 M18 6 L6 18\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Not your birthday, your phone, your email, your address or your school.</div>\n    </div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e34948\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M6 6 L18 18 M18 6 L6 18\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Take yourself off and the link stops working the same minute.</div>\n    </div>\n  </div>\n\n  <div style=\"background: linear-gradient(160deg, #123326 0%, #0c1d14 100%); border: 1px solid #24322a; border-radius: 18px; padding: 17px; display: flex; align-items: flex-start; gap: 12px;\">\n    <div style=\"width: 36px; height: 36px; border-radius: 12px; background: rgba(164, 121, 226, 0.18); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#a479e2\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"7.5\" r=\"2.8\"></circle><circle cx=\"16.5\" cy=\"9.5\" r=\"2.2\"></circle><path d=\"M4 20 c0 -4.2 2.2 -6.5 5 -6.5 s5 2.3 5 6.5\"></path><path d=\"M15 20 c0 -3 0.9 -4.8 2 -4.8 c1.9 0 3 1.6 3 4.8\"></path></svg></div>\n    <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n      <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Mum or Dad sends this one</div>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">You're under 16, so we ask your parent to read it and press send. It's the same for every club.</div>\n    </div>\n  </div>\n\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 10px;\">\n    <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7.5 v5\"></path><circle cx=\"12\" cy=\"16.2\" r=\"0.6\" fill=\"#7d8f85\"></circle></svg>\n    <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">Being on a register isn&rsquo;t a trial spot and it isn&rsquo;t a decision, so there is nothing here to be turned down from. You stay on it until you take yourself off &mdash; this season, and the next one.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: auto;\">\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Ask my parent to send it</div>\n    <div style=\"display: flex; align-items: center; justify-content: center; color: #7d8f85; font-weight: 700; font-size: 14px; height: 44px;\">Cancel</div>\n  </div>\n\n</div>", "title": "12 · I'm interested — the guardian sends", "w": 390}, "MyInterests": {"html": "<div style=\"width: 390px; min-height: 1340px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px;\">\n    <div style=\"width: 44px; height: 44px; margin: -11px; display: flex; align-items: center; justify-con ; font-weight: 700;\">Switch this link off</div>\n    </div>\n\n    <div style=\"background: #121b16; border: 1px solid rgba(237, 161, 0, 0.35); border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 11px;\">\n      <div style=\"display: flex; align-items: center; gap: 12px;\">\n        <div style=\"width: 40px; height: 40px; border-radius: 12px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 900; font-size: 13px; color: #b9c8bf;\">SU</div>\n        <div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\">\n          <div style=\"font-size: 14.5px; font-weight: 800; color: #eef5f0;\">Sunbury United</div>\n          <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">U15 Boys trial · 25 Oct</div>\n        </div>\n        <div style=\"background: rgba(237, 161, 0, 0.14); color: #eda100; border-radius: 7px; padding: 4px 9px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;\">Waiting on Mum</div>\n      </div>\n      <div style=\"font-size: 11.5px; color: #eda100; font-weight: 700;\">Asked this morning · nothing sent yet</div>\n      <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; border-radius: 12px; height: 42px; font-size: 13px; font-weight: 700;\">Remind her</div>\n    </div>\n\n  </div>\n\n  <div style=\"display: flex; align-items: flex-start; gap: 9px; padding: 0 2px;\">\n    <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6b7d73\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M12 2 L20 6 V11 C20 16.5 16.6 20.6 12 22 C7.4 20.6 4 16.5 4 11 V6 Z\"></path><path d=\"M9 12 L11 14 L15 9.5\"></path></svg>\n    <div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 700; line-height: 1.5;\">Mum can take you off any of these too, from her side.</div>\n  </div>\n\n</div>", "title": "13 · Where my CV is", "w": 390}, "EditPending": {"html": "<div style=\"width: 390px; min-height: 1220px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px;\">\n    <div style=\"width: 44px; height: 44px; margin: -11px; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5 L8 12 l7 7\"></path></svg></div>\n    <div style=\"display: flex; align-items: center; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">Your edit is pending</div>\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -0.015em; color: #eef5f0;\">Waiting on Mum again</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">You changed your page. Clubs are still seeing the version she already approved.</div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"background: #121b16; border: 1px solid #eda100; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"display: flex; align-items: center; gap: 9px; margin-bottom: 12px;\"><div style=\"width: 8px; height: 8px; border-radius: 999px; background: #eda100;\"></div><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">What changed</div></div>\n      <div style=\"display: flex; flex-direction: column; gap: 4px; margin-bottom: 13px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">About &mdash; before</div><div style=\"font-size: 13.5px; color: #7d8f85; font-weight: 500; line-height: 1.5; text-decoration: line-through;\">Works between the lines. Still sharpening my weak foot and my pressing triggers.</div></div>\n      <div style=\"display: flex; flex-direction: column; gap: 4px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3ddc84;\">About &mdash; yours</div><div style=\"font-size: 13.5px; color: #eef5f0; font-weight: 500; line-height: 1.5;\">Works between the lines. Two-footed now &mdash; been doing weak-foot finishing every Thursday since March.</div></div>\n    </div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Your live page has not changed. The clubs that have your link still see the approved one.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\" "M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Your first name and the letter your surname starts with. Nothing more of your name.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Your positions, your number and the numbers you chose to show.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e34948\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M6 6 L18 18 M18 6 L6 18\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Not your club, not your age group, not where you live, not your face.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e34948\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M6 6 L18 18 M18 6 L6 18\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">No link back to your page. Someone who likes it has to come and find Pitch themselves.</div></div>\n  </div>\n  <div style=\"background: linear-gradient(160deg, #123326 0%, #0c1d14 100%); border: 1px solid #24322a; border-radius: 16px; padding: 16px; display: flex; align-items: flex-start; gap: 12px;\"><div style=\"width: 36px; height: 36px; border-radius: 12px; background: rgba(164, 121, 226, 0.18) div style=\"width: 44px; height: 44px; margin: -11px; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5 L8 12 l7 7\"></path></svg></div>\n    <div style=\"display: flex; align-items: center; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Reset your password</div>\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -0.015em; color: #eef5f0;\">Check your email</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">If that address has an account, a reset link is on its way. It works once and expires in an hour.</div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 3px;\">\n      <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Email</div>\n      <div style=\"font-size: 15px; color: #eef5f0; font-weight: 700;\">deniz.mum@example.com</div>\n    </div>\n  </div>\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 10px;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7.5 v5\"></path><circle cx=\"12\" cy=\"16.2\" r=\"0.6\" fill=\"#7d8f85\"></circle></svg><div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">We show this screen whether or not the address has an account. That is deliberate &mdash; it stops anyone using the reset form to find out who is on Pitch.</div></div>\n  <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; font-weight: 700; font-size: 14px; border-radius: 14px; height: 46px;\">Send it again</div>\n  <div style=\"margin-top: auto;\">\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 10px;\"><div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">A parent who resets a password does not change anything about their child&rsquo;s profile. Approvals, links and controls all stay exactly as they were.</div></div>\n  </div>\n\n</div>", "title": "Password reset", "w": 390}, "LandingPlayer": {"html": "<div style=\"width: 390px; min-height: 1520px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px; padding: 22px 18px 34px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px;\">\n    <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg>\n    <div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div>\n  </div>\n\n  <div style=\"position: relative; overflow: hidden; border-radius: 22px; background: linear-gradient(160deg, #123326 0%, #0c1d14 60%, #0a1510 100%); padding: 26px 20px 24px 20px; display: flex; flex-direction: column; gap: 14px;\">\n    <div style=\"position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #d95926;\"></div>\n    <div style=\"position: absolute; right: -18px; top: -34px; font-size: 165px; font-weight: 900; color: rgba(61, 220, 132, 0.07); line-height: 1;\">9</div>\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #d95926; position: relative;\">For players · 18 and over</div>\n    <div style=\"font-size: 32px; font-weight: 900; line-height: 1.05; letter-spacing: -0.015em; color: #eef5f0; position: relative;\">Stop retyping<br>your football.</div>\n    <div style=\"font-size: 14.5px; color: #b9c8bf; font-weight: 500; line-height: 1.6; position: relative;\">Every preseason you write the same email. Clubs, positions, what you did last year, a highlights link that expires. Build it once, keep it for good, send it in one tap.</div>\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px; margin-top: 4px; position: relative;\">Build my CV — free</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3ddc84;\">Two minutes, then it's yours</div>\n\n    <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n      <div style=\"display: flex; align-items: flex-start; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n        <div style=\"width: 26px; height: 26px; border-radius: 9px; background: rgba(61, 220, 132, 0.14); color: #3ddc84; font-weight: 900; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">1</div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Your position, your number, your clubs</div>\n          <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Pick up to three positions from a real list. Add the clubs you've played for, and the football that happened outside them — school, futsal, rep sides.</div>\n        </div>\n      </div>\n      <div style=\"display: flex; align-items: flex-start; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n        <div style=\"width: 26px; height: 26px; border-radius: 9px; background: rgba(61, 220, 132, 0.14); color: #3ddc84; font-weight: 900; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">2</div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">The numbers you choose to show</div>\n          <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Appearances, goals, assists, clean sheets. You pick which of them go on your page, so a keeper isn't stuck showing three zeros where the goals go.</div>\n        </div>\n      </div>\n      <div style=\"display: flex; align-items: flex-start; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n        <div style=\"width: 26px; height: 26px; border-radius: 9px; background: rgba(61, 220, 132, 0.14); color: #3ddc84; font-weight: 900; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">3</div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Clips that stay put</div>\n          <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">YouTube, Instagram or Veo. Three on the free tier.</div>\n        </div>\n      </div>\n    </div>\n  </div>\n\n  <div style=\"position: relative; overflow: hidden; border-radius: 16px; background: #121b16; border: 1px solid #24322a; padding: 15px 14px; display: flex; flex-direction: column; gap: 12px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3ddc84;\">Sending it</div>\n    <div style=\"font-size: 20px; font-weight: 900; color: #eef5f0; line-height: 1.2; letter-spacing: -0.015em;\">Send it to a club without writing an email.</div>\n    <div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 500; line-height: 1.6;\">Find a club or a trial notice, check the address, send. The club opens a page, not an attachment — so if you change clubs in March, what they're looking at changes too. And you can switch the link off whenever you like.</div>\n    <div style=\"display: flex; align-items: center; gap: 10px; background: #1a2420; border-radius: 12px; padding: 12px 14px;\">\n      <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M21 3 L11 13\"></path><path d=\"M21 3 L14.5 21 L11 13 L3 9.5 Z\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 700;\">One tap. No cover letter. No attachment.</div>\n    </div>\n  </div>\n\n  <div style=\"height: 1px; background: #24322a;\"></div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3ddc84;\">What it costs</div>\n    <div style=\"display: flex; gap: 10px;\">\n      <div style=\"flex: 1; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 8px;\">\n        <div style=\"font-size: 13px; font-weight: 800; color: #eef5f0;\">Free</div>\n        <div style=\"font-size: 24px; font-weight: 900; color: #eef5f0; line-height: 1;\">$0</div>\n        <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">The whole CV, three clips, and sending to clubs. No time limit.</div>\n      </div>\n      <div style=\"flex: 1; background: #121b16; border: 1px solid #2f6d4c; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 8px;\">\n        <div style=\"font-size: 13px; font-weight: 800; color: #eda100;\">Pro · Coming December</div>\n        <div style=\"font-size: 24px; font-weight: 900; color: #eef5f0; line-height: 1;\">$79<span style=\"font-size: 13px; font-weight: 700; color: #7d8f85;\">/yr</span></div>\n        <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Unlimited clips, and clubs asking for your CV. <b style=\"color: #b9c8bf;\">Opens December</b> — tap to be first in line.</div>\n      </div>\n    </div>\n  </div>\n\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 13px;\">\n    <div style=\"display: inline-flex; align-items: center; gap: 7px; background: rgba(237, 161, 0, 0.14); border-radius: 999px; padding: 5px 11px; align-self: flex-start;\"><div style=\"width: 6px; height: 6px; border-radius: 999px; background: #eda100;\"></div><div style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">Coming soon</div></div>\n    <div style=\"display: flex; flex-direction: column; gap: 10px;\"><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 700; line-height: 1.45;\">Clubs finding you, not just you finding clubs</div></div><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 700; line-height: 1.45;\">Your coach's word on your record, not only your own</div></div><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 700; line-height: 1.45;\">Every season you play, kept — whatever club you end up at</div></div><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 700; line-height: 1.45;\">Clubs asking to see your CV</div></div></div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Nothing here promises a club will call you.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 4px;\">\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Build my CV — free</div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; text-align: center;\">Australia first</div>\n  </div>\n\n</div>", "title": "1 · Landing — player 18+", "w": 390}, "SignUpAdult": {"html": "<div style=\"width: 390px; min-height: 900px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px;\">\n    <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg>\n    <div style=\"font-weight: 800; font-size: 15px;\">Pitch</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 5px;\">\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; color: #eef5f0;\">What's your position?</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #121b16; border: 1.5px solid #3ddc84; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"width: 40px; height: 40px; border-radius: 12px; background: rgba(61, 220, 132, 0.14); display: flex; align-items: center; justify-content: center;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"6.5\" r=\"3\"></circle><path d=\"M12 10 V15 M12 15 L8 20 M12 15 L16.5 18.5 M6 12.5 L12 11 M18 11.5 L12 11\"></path></svg></div>\n      <div style=\"display: flex; flex-direction: column; gap: 1px;\"><div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">Player</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Build your football CV</div></div>\n    </div>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"width: 40px; height: 40px; border-radius: 12px; background: #1a2420; display: flex; align-items: center; justify-content: center;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"4\" width=\"12\" height=\"17\" rx=\"2\"></rect><path d=\"M9.5 4 V2.8 H14.5 V4 M9 9 H15 M9 12.5 H15 M9 16 H12.5\"></path></svg></div>\n      <div style=\"display: flex; flex-direction: column; gap: 1px;\"><div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">Coach</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Develop your squad</div></div>\n    </div>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"width: 40px; height: 40px; border-radius: 12px; background: #1a2420; display: flex; align-items: center; justify-content: center;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"7\" r=\"2.6\"></circle><circle cx=\"16.5\" cy=\"9\" r=\"2.1\"></circle><path d=\"M4.5 20 C4.5 15.5 6.5 13.5 9 13.5 C11.5 13.5 13.5 15.5 13.5 20 M14.5 20 C14.5 16.8 15.4 14.8 16.5 14.8 C18.4 14.8 19.8 16.5 19.8 20\"></path></svg></div>\n      <div style=\"display: flex; flex-direction: column; gap: 1px;\"><div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">Parent / Guardian</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Approve and see their record</div></div>\n    </div>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"width: 40px; height: 40px; border-radius: 12px; background: #1a2420; display: flex; align-items: center; justify-content: center;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 21 V4 M6 4 H17 L15 7 L17 10 H6\"></path><path d=\"M3.5 21 H10\"></path></svg></div>\n      <div style=\"display: flex; flex-direction: column; gap: 1px;\"><div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">Club</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Your club's home ground</div></div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 8px; margin-top: 4px;\">\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 2px;\">\n      <div style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">Date of birth</div>\n      <div style=\"font-size: 15px; color: #6b7d73; font-weight: 500;\">DD / MM / YYYY</div>\n    </div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">18 or over? Your profile goes live as soon as you build it — no approval step, and no guardian on your account.</div>\n  </div>\n\n  <div style=\"display: flex; align-items: center; gap: 9px; margin-top: 2px;\">\n    <div style=\"width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid #3a4a42; flex-shrink: 0;\"></div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">I agree to t
