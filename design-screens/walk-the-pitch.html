gust</div>\n        </div>\n        <div style=\"display: flex; align-items: center; gap: 9px;\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M10 13.5 a4.5 4.5 0 0 0 6.6 0.4 l2.6 -2.6 a4.5 4.5 0 0 0 -6.4 -6.4 L11.3 6.5\"></path><path d=\"M14 10.5 a4.5 4.5 0 0 0 -6.6 -0.4 l-2.6 2.6 a4.5 4.5 0 0 0 6.4 6.4 l1.5 -1.5\"></path></svg>\n          <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500;\">Link active · expires 31 October</div>\n        </div>\n        <div style=\"display: flex; align-items: center; gap: 9px;\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M4 6 h16 v12 H4 Z\"></path><path d=\"M4 7 l8 6 l8 -6\"></path></svg>\n          <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500;\">Sent to 2 clubs</div>\n        </div>\n      </div>\n\n      <div style=\"display: flex; gap: 8px;\">\n        <div style=\"flex: 1; border: 1px solid #24322a; color: #b9c8bf; border-radius: 13px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 13.5px; font-weight: 700;\">See his page</div>\n        <div style=\"flex: 1; background: #1a2420; color: #eef5f0; border-radius: 14px; height: 46px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;\">Manage</div>\n      </div>\n    </div>\n\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 14px;\">\n      <div style=\"display: flex; align-items: center; gap: 13px;\">\n        <div style=\"width: 52px; height: 52px; border-radius: 16px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 900; font-size: 18px; color: #b9c8bf;\">NH</div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px; flex: 1;\">\n          <div style=\"font-size: 16px; font-weight: 800; color: #eef5f0;\">Nate Halloran &middot; 17</div>\n          <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500;\">Northern United SC &mdash; Seniors</div>\n        </div>\n      </div>\n\n      <div style=\"display: flex; flex-direction: column; gap: 7px;\">\n        <div style=\"display: flex; align-items: center; gap: 9px;\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n          <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500;\">Sends for himself &mdash; you keep the off-switch</div>\n        </div>\n        <div style=\"display: flex; align-items: center; gap: 9px;\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M4 6 h16 v12 H4 Z\"></path><path d=\"M4 7 l8 6 l8 -6\"></path></svg>\n          <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500;\">On 2 club registers</div>\n        </div>\n        <div style=\"display: flex; align-items: center; gap: 9px;\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#eda100\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7.5 v5\"></path></svg>\n          <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500;\">Turns 18 on 14 March &mdash; your access ends then</div>\n        </div>\n      </div>\n\n      <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; border-radius: 13px; height: 44px; font-size: 13.5px; font-weight: 700;\">Manage</div>\n    </div>\n\n    <div style=\"border: 1px dashed #3a4a42; border-radius: 16px; height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5 v14 M5 12 h14\"></path></svg>\n      <div style=\"font-size: 13.5px; color: #7d8f85; font-weight: 700;\">Add another child</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 8px; margin-top: auto;\">\n    <div style=\"display: flex; align-items: center; justify-content: space-between; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 700;\">Everything that's happened</div>\n      <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 5 l7 7 l-7 7\"></path></svg>\n    </div>\n    <div style=\"display: flex; align-items: center; justify-content: space-between; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 700;\">Get help</div>\n      <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 5 l7 7 l-7 7\"></path></svg>\n    </div>\n  </div>\n\n</div>", "title": "4 · Your family — two children, two pending items", "w": 390}, "GuardianControls": {"html": "<div style=\"width: 390px; min-height: 1620px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px;\">\n    <div style=\"width: 44px; height: 44px; margin: -11px; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5 L8 12 l7 7\"></path></svg></div>\n    <div style=\"display: flex; align-items: center; gap: 8px;\">\n      <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg>\n      <div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; align-items: center; gap: 13px;\">\n    <div style=\"width: 48px; height: 48px; border-radius: 15px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 900; font-size: 17px; color: #b9c8bf;\">DY</div>\n    <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n      <div style=\"font-size: 22px; font-weight: 900; color: #eef5f0; letter-spacing: -0.015em;\">Deniz Yılmaz</div>\n      <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500;\">14 · Riverside FC — U15s</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">His link</div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 11px;\">\n      <div style=\"font-size: 14px; font-weight: 800; color: #3ddc84; word-break: break-all;\">pitchfootball.com.au/p/7Kq2·9fRt</div>\n      <div style=\"display: flex; align-items: center; gap: 8px;\">\n        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7.5 v4.8 l3 1.8\"></path></svg>\n        <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500;\">Expires 31 October · 90 days from when you made it</div>\n      </div>\n      <div style=\"display: flex; gap: 8px;\">\n        <div style=\"flex: 1; border: 1px solid #24322a; color: #b9c8bf; border-radius: 12px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;\">Copy</div>\n        <div style=\"flex: 1; border: 1px solid #24322a; color: #b9c8bf; border-radius: 12px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;\">Renew</div>\n        <div style=\"flex: 1; border: 1px solid #24322a; color: #b9c8bf; border-radius: 12px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;\">Replace</div>\n      </div>\n      <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Replacing it kills the old one immediately. Anyone holding it — including the two clubs below — stops being able to open his page.</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Who has it</div>\n    <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n      <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; gap: 12px;\">\n        <div style=\"width: 38px; height: 38px; border-radius: 12px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 900; font-size: 12px; color: #b9c8bf;\">NU</div>\n        <div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\">\n          <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Northern United SC</div>\n          <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">You emailed his CV · 20 August</div>\n        </div>\n      </div>\n      <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; gap: 12px;\">\n        <div style=\"width: 38px; height: 38px; border-radius: 12px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 900; font-size: 12px; color: #b9c8bf;\">KR</div>\n        <div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\">\n          <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Kingsway Rovers FC</div>\n          <div style=\"display: flex; align-items: center; gap: 6px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #3ddc84;\"></div><div style=\"font-size: 12px; color: #3ddc84; font-weight: 700;\">On their interest register</div></div>\n          <div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 700;\">You registered him 27 August</div>\n        </div>\n        <div style=\"border: 1px solid #24322a; color: #b9c8bf; border-radius: 9px; padding: 7px 10px; font-size: 11px; font-weight: 700; flex-shrink: 0;\">Take him off</div>\n      </div>\n    </div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">We never tell you whether a club opened it, and we never tell Deniz. That does not change, and it is not something anyone can buy. Taking him off a register removes the entry and stops the link for that club the same minute.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Pause it</div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; gap: 13px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 3px; flex: 1;\">\n        <div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">Deniz's page is live</div>\n        <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Switch it off and every link stops working until you switch it back on. Nothing is deleted.</div>\n      </div>\n      <div style=\"width: 46px; height: 27px; border-radius: 999px; background: #3ddc84; display: flex; align-items: center; justify-content: flex-end; padding: 0 3px; flex-shrink: 0;\">\n        <div style=\"width: 21px; height: 21px; border-radius: 999px; background: #06130c;\"></div>\n      </div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Everything that's happened</div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 6px 14px; display: flex; flex-direction: column;\">\n      <div style=\"display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid #1a2420;\"><div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 700; width: 52px; flex-shrink: 0;\">27 Aug</div><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500;\">You put him on Kingsway Rovers’ register</div></div>\n      <div style=\"display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid #1a2420;\"><div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 700; width: 52px; flex-shrink: 0;\">20 Aug</div><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500;\">You emailed his CV to Northern United SC</div></div>\n      <div style=\"display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid #1a2420;\"><div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 700; width: 52px; flex-shrink: 0;\">2 Aug</div><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500;\">Link created</div></div>\n      <div style=\"display: flex; gap: 12px; padding: 11px 0;\"><div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 700; width: 52px; flex-shrink: 0;\">1 Aug</div><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500;\">You approved his profile</div></div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n    <div style=\"background: #121b16; border: 1px solid #e34948; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 11px;\">\n      <div style=\"font-size: 15px; font-weight: 800; color: #e34948;\">Delete everything</div>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">His page, his photo, his clips, his stats. Gone, and not recoverable. No reason needed and nobody will ask you for one.</div>\n      <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">We keep one thing: a record that you gave permission and then withdrew it. No football, no photo, no page — just the fact it happened, because we have to be able to show it did.</div>\n      <div style=\"border: 1px solid #e34948; color: #e34948; border-radius: 13px; height: 46px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800;\">Delete Deniz's profile</div>\n    </div>\n  </div>\n\n</div>", "title": "5 · NEW — the controls, under 16", "w": 390}, "GuardianControls1617": {"html": "<div style=\"width: 390px; min-height: 1520px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px;\">\n    <div style=\"width: 44px; height: 44px; margin: -11px; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5 L8 12 l7 7\"></path></svg></div>\n    <div style=\"display: flex; align-items: center; gap: 8px;\">\n      <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg>\n      <div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; align-items: center; gap: 13px;\">\n    <div style=\"width: 48px; height: 48px; border-radius: 15px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 900; font-size: 17px; color: #b9c8bf;\">NH</div>\n    <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n      <div style=\"font-size: 22px; font-weight: 900; color: #eef5f0; letter-spacing: -0.015em;\">Nate Halloran</div>\n      <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500;\">17 · Northern United SC — Seniors</div>\n    </div>\n  </div>\n\n  <div style=\"background: linear-gradient(160deg, #123326 0%, #0c1d14 100%); border: 1px solid #24322a; border-radius: 18px; padding: 17px; display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 16px; font-weight: 900; color: #eef5f0; line-height: 1.3; letter-spacing: -0.015em;\">At 16 he started doing this himself</div>\n    <div style=\"font-size: 13px; color: #b9c8bf; font-weight: 500; line-height: 1.6;\">Nate holds his own link and sends his own CV. He doesn't need your approval any more — but you're told every time, you see everything he sees, and the two switches below are yours.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Your switches</div>\n\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; gap: 13px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 3px; flex: 1;\">\n        <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap;\"><div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">Verified clubs can find Nate</div><div style=\"display: inline-flex; align-items: center; gap: 6px; background: rgba(237, 161, 0, 0.14); border-radius: 999px; padding: 4px 9px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100;\"></div><div style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">Coming December</div></div></div>\n        <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Club search opens in December. Set this now and it will already be how you want it — only clubs we have verified, and only from sixteen.</div>\n      </div>\n      <div style=\"width: 46px; height: 27px; border-radius: 999px; background: #3ddc84; display: flex; align-items: center; justify-content: flex-end; padding: 0 3px; flex-shrink: 0;\">\n        <div style=\"width: 21px; height: 21px; border-radius: 999px; background: #06130c;\"></div>\n      </div>\n    </div>\n\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; gap: 13px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 3px; flex: 1;\">\n        <div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">Nate can send his CV</div>\n        <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Switch it off and he'll see that sending is off on his account. He won't be told it was you.</div>\n      </div>\n      <div style=\"width: 46px; height: 27px; border-radius: 999px; background: #3ddc84; display: flex; align-items: center; justify-content: flex-end; padding: 0 3px; flex-shrink: 0;\">\n        <div style=\"width: 21px; height: 21px; border-radius: 999px; background: #06130c;\"></div>\n      </div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Where his CV has gone</div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 6px 14px; display: flex; flex-direction: column;\">\n      <div style=\"display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid #1a2420;\"><div style=\"font-size: 11.5px; color: #6b7d73; font-weight: 700; width: 52px; flex-shrink: 0;\">24 Aug</div><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500;\">Nate registered interest with Kingsway Rovers FC</div></div>\n      <div style=\"display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid #1a2420;\"><div style=\"font-size: 11.5px; color: #6b7d73; font-weight: 700; width: 52px; flex-shrink: 0;\">16 Aug</div><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500;\">Nate registered interest with Riverside FC</div></div>\n      <div style=\"display: flex; gap: 12px; padding: 11px 0;\"><div style=\"font-size: 11.5px; color: #6b7d73; font-weight: 700; width: 52px; flex-shrink: 0;\">2 Aug</div><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500;\">Ready to be found by verified clubs from December</div></div>\n    </div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">You get a message the moment each one goes. We never tell either of you whether a club opened it. At eighteen that becomes his own choice, on his own account.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">What happens at 18</div>\n    <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 11px;\">\n      <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15.5\" rx=\"2.5\"></rect><path d=\"M3.5 9.5 h17 M8 3.5 v3 M16 3.5 v3\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">On <b style=\"color: #eef5f0;\">14 March 2027</b> your access ends by itself — the switches, the record, all of it. Nate can choose to give it back, and that choice is his alone. His football stays exactly where it is.</div>\n    </div>\n  </div>\n\n  <div style=\"background: #121b16; border: 1px solid #e34948; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 11px; margin-top: auto;\">\n    <div style=\"font-size: 15px; font-weight: 800; color: #e34948;\">Delete everything</div>\n    <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Yours or his, either of you, right up to his eighteenth birthday. No reason needed.</div>\n    <div style=\"border: 1px solid #e34948; color: #e34948; border-radius: 13px; height: 46px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800;\">Delete Nate's profile</div>\n  </div>\n\n</div>", "title": "6 · NEW — the controls at 16–17", "w": 390}, "SendCVGuardian": {"html": "<div style=\"width: 390px; min-height: 1090px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px;\">\n    <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg>\n    <div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #a479e2;\">Deniz asked you to send this</div>\n    <div style=\"font-size: 24px; font-weight: 900; line-height: 1.15; letter-spacing: -0.015em; color: #eef5f0;\">Send Deniz's CV to Northern United SC?</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Nothing has been sent. It only goes if you send it.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">It goes to</div>\n    <div style=\"background: #121b16; border: 1px solid #3ddc84; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 7px;\">\n      <div style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; color: #eef5f0; font-weight: 700; word-break: break-all; line-height: 1.4;\">football@northernunitedsc.com.au</div>\n      <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Deniz typed this from the club's trial notice</div>\n    </div>\n    <div style=\"display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid #24322a; color: #b9c8bf; font-weight: 700; font-size: 14px; border-radius: 14px; height: 46px;\">Change the address</div>\n  </div>\n\n  <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 11px;\">\n    <div style=\"font-size: 13.5px; font-weight: 800; color: #eef5f0;\">What the club receives</div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">A link to Deniz's CV — not a file, and not a copy.</div>\n    </div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">You can pause or replace that link later. The club's access stops when you do.</div>\n    </div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">If they reply, it comes to you and Deniz together.</div>\n    </div>\n    <div style=\"height: 1px; background: #24322a;\"></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e34948\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M6 6 L18 18 M18 6 L6 18\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">No contact details for you or Deniz — not now, and not if they reply.</div>\n    </div>\n  </div>\n\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 10px;\">\n    <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7.5 v5\"></path><circle cx=\"12\" cy=\"16.2\" r=\"0.6\" fill=\"#7d8f85\"></circle></svg>\n    <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">If you'd rather not, do nothing. This disappears by itself and Deniz can ask again another time.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: auto;\">\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px; text-align: center; padding: 0 14px; line-height: 1.3;\">Send it to Northern United SC</div>\n    <div style=\"display: flex; align-items: center; justify-content: center; color: #7d8f85; font-weight: 700; font-size: 14px; height: 44px;\">Not this one</div>\n  </div>\n\n</div>", "title": "7 · Confirm and send a CV", "w": 390}, "InterestGuardian": {"html": "<div style=\"width: 390px; min-height: 1420px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px;\">\n    <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg>\n    <div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #a479e2;\">Deniz asked you to send this</div>\n    <div style=\"font-size: 24px; font-weight: 900; line-height: 1.15; letter-spacing: -0.015em; color: #eef5f0;\">Put Deniz on Kingsway Rovers' register?</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Nothing has been sent. It only goes if you send it.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">What he wrote</div>\n    <div style=\"background: #121b16; border: 1px solid #3ddc84; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 12px;\">\n      <div style=\"display: flex; gap: 22px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 9.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">Squad</div>\n          <div style=\"font-size: 14px; color: #eef5f0; font-weight: 700;\">U15 Boys</div>\n        </div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 9.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">Where he'd play</div>\n          <div style=\"font-size: 14px; color: #eef5f0; font-weight: 700;\">AM, LW</div>\n        </div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 9.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">Trial</div>\n          <div style=\"font-size: 14px; color: #eef5f0; font-weight: 700;\">Sun 5 Oct</div>\n        </div>\n      </div>\n      <div style=\"height: 1px; background: #24322a;\"></div>\n      <div style=\"display: flex; flex-direction: column; gap: 5px;\">\n        <div style=\"font-size: 9.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">His line</div>\n        <div style=\"font-size: 13.5px; color: #eef5f0; font-weight: 500; line-height: 1.5;\">&ldquo;Right-footed 10. Happy anywhere across the front three.&rdquo;</div>\n      </div>\n    </div>\n    <div style=\"display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid #24322a; color: #b9c8bf; font-weight: 700; font-size: 14px; border-radius: 14px; height: 46px;\">Edit what he wrote</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">It goes to</div>\n    <div style=\"display: flex; align-items: center; gap: 13px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"width: 42px; height: 42px; border-radius: 13px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 900; font-size: 13px; color: #b9c8bf;\">KR</div>\n      <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n        <div style=\"font-size: 14.5px; font-weight: 800; color: #eef5f0;\">Kingsway Rovers FC</div>\n        <div style=\"display: flex; align-items: center; gap: 5px;\"><div style=\"width: 6px; height: 6px; border-radius: 999px; background: #3ddc84;\"></div><div style=\"font-size: 11px; font-weight: 800; color: #3ddc84;\">Verified club on Pitch</div></div>\n      </div>\n    </div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">No email address to check this time — it goes into the club's own register inside Pitch, not to an inbox.</div>\n  </div>\n\n  <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 11px;\">\n    <div style=\"font-size: 13.5px; font-weight: 800; color: #eef5f0;\">What the club receives</div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">A link to Deniz&rsquo;s CV &mdash; not a file, and not a copy. They cannot download or keep one.</div>\n    </div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">You can take him off the register any time. Their access ends when you do.</div>\n    </div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">If they invite him to a trial, that invitation comes to you first.</div>\n    </div>\n    <div style=\"height: 1px; background: #24322a;\"></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e34948\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M6 6 L18 18 M18 6 L6 18\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">No contact details for you or Deniz — not now, and not if they reply.</div>\n    </div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e34948\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M6 6 L18 18 M18 6 L6 18\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">They see his name, his age and his club &mdash; that is how a coach picks a squad. No birthday, no school, no address, and no way to contact either of you.</div>\n    </div>\n  </div>\n\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 10px;\">\n    <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7.5 v5\"></path><circle cx=\"12\" cy=\"16.2\" r=\"0.6\" fill=\"#7d8f85\"></circle></svg>\n    <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">A register is a list of who wants to be there, not a decision anyone owes him &mdash; so there is no result coming and nothing to be turned down from. If you'd rather not, do nothing — this disappears by itself.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: auto;\">\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px; text-align: center; padding: 0 14px; line-height: 1.3;\">Register his interest</div>\n    <div style=\"display: flex; align-items: center; justify-content: center; color: #7d8f85; font-weight: 700; font-size: 14px; height: 44px;\">Not this one</div>\n  </div>\n\n</div>", "title": "8 · NEW — confirm an interest registration", "w": 390}, "ConfirmDelete": {"html": "<div style=\"width: 390px; min-height: 940px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div>\n  <div style=\"flex: 1;\"></div>\n  <div style=\"background: #121b16; border: 1px solid #e34948; border-radius: 22px; padding: 22px 18px; display: flex; flex-direction: column; gap: 16px;\">\n    <div style=\"width: 48px; height: 48px; border-radius: 15px; background: rgba(227, 73, 72, 0.14); display: flex; align-items: center; justify-content: center;\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e34948\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 7 h14 M9 7 V5 h6 v2 M7 7 l1 13 h8 l1 -13\"></path></svg></div>\n    <div style=\"display: flex; flex-direction: column; gap: 8px;\"><div style=\"font-size: 22px; font-weight: 900; color: #eef5f0; line-height: 1.2; letter-spacing: -0.015em;\">Delete Deniz&rsquo;s profile?</div><div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">His page, his photo, his clips and his stats. This cannot be undone and we cannot get it back for you.</div></div>\n    <div style=\"background: #1a2420; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">The two clubs holding his link stop being able to open it, immediately.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">He is taken off Kingsway Rovers&rsquo; register.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">We keep one line: that you gave permission and then withdrew it. No football, no photo.</div></div>\n    </div>\n    <div style=\"background: #0b120e; border: 1px solid #24322a; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Type DELETE to confirm</div><div style=\"font-size: 16px; color: #6b7d73; font-weight: 800; letter-spacing: 0.06em;\">DELETE</div></div>\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #e34948; color: #eef5f0; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Delete everything</div>\n    <div style=\"display: flex; align-items: center; justify-content: center; color: #7d8f85; font-weight: 700; font-size: 14px; height: 44px;\">Keep his profile</div>\n  </div>\n\n</div>", "title": "9 · NEW — confirming something irreversible", "w": 390}, "ReapproveChanges": {"html": "<div style=\"width: 390px; min-height: 1300px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div>\n  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #a479e2;\">Waiting on you</div>\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -0.015em; color: #eef5f0;\">Deniz changed his page</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Only this change needs you. Everything else stays exactly as you approved it.</div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">He rewrote his About</div>\n    <div style=\"background: #121b16; border: 1px solid #a479e2; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">You approved this on 1 August</div><div style=\"font-size: 13.5px; color: #7d8f85; font-weight: 500; line-height: 1.5; text-decoration: line-through;\">Works between the lines. Still sharpening my weak foot and my pressing triggers.</div></div>\n      <div style=\"display: flex; flex-direction: column; gap: 4px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3ddc84;\">He wants this instead</div><div style=\"font-size: 13.5px; color: #eef5f0; font-weight: 500; line-height: 1.5;\">Works between the lines. Two-footed now &mdash; been doing weak-foot finishing every Thursday since March.</div></div>\n    </div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Until you approve it, every club holding his link still reads the old version.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">You can edit his words before you approve them.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Saying no leaves the approved page exactly where it is. He can try again.</div></div>\n  </div>\n  <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Approve the change</div>\n  <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; font-weight: 700; font-size: 14px; border-radius: 14px; height: 46px;\">Edit his words first</div>\n  <div style=\"display: flex; align-items: center; justify-content: center; color: #7d8f85; font-weight: 700; font-size: 14px; height: 44px;\">Not this one</div>\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 10px;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7.5 v5\"></path><circle cx=\"12\" cy=\"16.2\" r=\"0.6\" fill=\"#7d8f85\"></circle></svg><div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">You will see this screen for every change he makes to his page &mdash; his About, a clip title, a new club. Photos and stats included.</div></div>\n\n</div>", "title": "10 · NEW — approving a change (D-119)", "w": 390}, "InviteGuardian": {"html": "<div style=\"width: 390px; min-height: 1420px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div>\n  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #a479e2;\">Waiting on you</div>\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -0.015em; color: #eef5f0;\">Riverside FC would like Josh at a trial</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Josh has not been told. Nothing happens until you decide.</div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"background: #121b16; border: 1px solid #a479e2; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"display: flex; align-items: center; gap: 13px; margin-bottom: 13px;\"><div style=\"width: 44px; height: 44px; border-radius: 13px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 900; font-size: 14px; color: #b9c8bf;\">RF</div><div style=\"display: flex; flex-direction: column; gap: 3px;\"><div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">Riverside FC</div><div style=\"display: flex; align-items: center; gap: 5px;\"><div style=\"width: 6px; height: 6px; border-radius: 999px; background: #3ddc84;\"></div><div style=\"font-size: 11px; font-weight: 800; color: #3ddc84;\">Verified against Football Victoria</div></div></div></div>\n      <div style=\"height: 1px; background: #24322a;\"></div>\n      <div style=\"display: flex; gap: 24px; padding: 13px 0;\"><div style=\"display: flex; flex-direction: column; gap: 3px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Squad</div><div style=\"font-size: 14.5px; color: #eef5f0; font-weight: 700;\">U16 Boys</div></div><div style=\"display: flex; flex-direction: column; gap: 3px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Trial</div><div style=\"font-size: 14.5px; color: #eef5f0; font-weight: 700;\">Sun 11 Oct, 9:00 AM</div></div></div>\n      <div style=\"height: 1px; background: #24322a;\"></div>\n      <div style=\"padding-top: 13px; display: flex; flex-direction: column; gap: 5px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Their note</div><div style=\"font-size: 13.5px; color: #eef5f0; font-weight: 500; line-height: 1.55;\">&ldquo;Saw Josh at Dunstan. We&rsquo;re short a keeper in the 16s and we&rsquo;d like a proper look at him.&rdquo;</div></div>\n    </div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">They have his CV, his name, his age and his club. They have never had your phone number or your email.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Doing nothing is a complete answer. They are told nothing either way.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">If you say yes, you choose what you hand over. It is not automatic.</div></div>\n  </div>\n  <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Reply to Riverside FC</div>\n  <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; font-weight: 700; font-size: 14px; border-radius: 14px; height: 46px;\">Not this time</div>\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 10px;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7.5 v5\"></path><circle cx=\"12\" cy=\"16.2\" r=\"0.6\" fill=\"#7d8f85\"></circle></svg><div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">&ldquo;Not this time&rdquo; does not remove Josh from their register and does not count against him. It closes this one invitation, and the club is simply not told.</div></div>\n\n</div>", "title": "11 · NEW — the invitation arrives", "w": 390}, "GuardianReply": {"html": "<div style=\"width: 390px; min-height: 1520px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px;\">\n    <div style=\"width: 44px; height: 44px; margin: -11px; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5 L8 12 l7 7\"></path></svg></div>\n    <div style=\"display: flex; align-items: center; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #a479e2;\">Josh · U16 Boys trial, 11 Oct</div>\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -0.015em; color: #eef5f0;\">Reply to Riverside FC</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">You choose what goes with your answer. Everything below starts switched off.</div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Your answer</div>\n    <div style=\"display: flex; gap: 8px;\"><div style=\"flex: 1; background: rgba(61, 220, 132, 0.14); border: 1.5px solid #3ddc84; color: #3ddc84; border-radius: 14px; height: 52px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900;\">He&rsquo;ll be there</div><div style=\"flex: 1; border: 1px solid #24322a; color: #7d8f85; border-radius: 14px; height: 52px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;\">Interested, not that date</div></div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">What you hand over</div>\n    <div style=\"background: #121b16; border: 1px solid #3ddc84; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; gap: 13px;\"><div style=\"display: flex; flex-direction: column; gap: 3px; flex: 1;\"><div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">My phone number</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.45;\">So they can call you about the day. 0412 ••• •••</div></div><div style=\"width: 46px; height: 27px; border-radius: 999px; background: #3ddc84; display: flex; align-items: center; justify-content: flex-end; padding: 3px; flex-shrink: 0;\"><div style=\"width: 21px; height: 21px; border-radius: 999px; background: #06130c;\"></div></div></div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; gap: 13px;\"><div style=\"display: flex; flex-direction: column; gap: 3px; flex: 1;\"><div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">My email address</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.45;\">If you would rather they wrote. m.whelan@••••••</div></div><div style=\"width: 46px; height: 27px; border-radius: 999px; background: #2c3a33; display: flex; align-items: center; justify-content: flex-start; padding: 3px; flex-shrink: 0;\"><div style=\"width: 21px; height: 21px; border-radius: 999px; background: #7d8f85;\"></div></div></div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; gap: 13px;\"><div style=\"display: flex; flex-direction: column; gap: 3px; flex: 1;\"><div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Josh&rsquo;s coach at Northern United</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.45;\">Lets the two clubs talk to each other about him.</div></div><div style=\"width: 46px; height: 27px; border-radius: 999px; background: #2c3a33; display: flex; align-items: center; justify-content: flex-start; padding: 3px; flex-shrink: 0;\"><div style=\"width: 21px; height: 21px; border-radius: 999px; background: #7d8f85;\"></div></div></div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Anything you want to say</div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; min-height: 74px;\"><div style=\"font-size: 13.5px; color: #eef5f0; font-weight: 500; line-height: 1.5;\">He&rsquo;s in. He trains Tuesdays with his own club so a Sunday works well for us.</div></div>\n  </div>\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 10px;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7.5 v5\"></path><circle cx=\"12\" cy=\"16.2\" r=\"0.6\" fill=\"#7d8f85\"></circle></svg><div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">The moment you hand over a phone number, that part of the conversation leaves Pitch and we cannot switch it off for you. Josh&rsquo;s CV link is separate &mdash; you keep that control whatever you do here.</div></div>\n  <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Send my reply</div>\n  <div style=\"display: flex; align-items: center; justify-content: center; color: #7d8f85; font-weight: 700; font-size: 14px; height: 44px;\">Back</div>\n\n</div>", "title": "12 · NEW — the parent replies", "w": 390}, "ShareApproval": {"html": "<div style=\"width: 390px; min-height: 1460px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div>\n  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #a479e2;\">Waiting on you</div>\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -0.015em; color: #eef5f0;\">Deniz wants to post this</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Have a proper look at it. Nothing leaves Pitch until you say yes.</div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">The card, exactly as it would post</div>\n    <div style=\"background: linear-gradient(160deg, #123326 0%, #0c1d14 60%, #0a1510 100%); border: 1px solid #3ddc84; border-radius: 18px; padding: 22px 18px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden;\">\n      <div style=\"position: absolute; right: -14px; top: -26px; font-size: 130px; font-weight: 900; color: rgba(61, 220, 132, 0.07); line-height: 1;\">10</div>\n      <div style=\"display: flex; align-items: center; gap: 8px; position: relative;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div>\n      <div style=\"display: flex; align-items: center; gap: 13px; position: relative;\"><div style=\"width: 48px; height: 48px; border-radius: 15px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 900; font-size: 15px; color: #b9c8bf;\">DY</div><div style=\"display: flex; flex-direction: column; gap: 3px;\"><div style=\"font-size: 19px; font-weight: 900; color: #eef5f0; letter-spacing: -0.015em;\">Deniz Y.</div><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500;\">Attacking midfielder &middot; Left wing &middot; #10</div></div></div>\n      <div style=\"display: flex; gap: 8px; position: relative;\"><div style=\"flex: 1; background: rgba(255,255,255,0.08); border-radius: 12px; padding: 11px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px;\"><div style=\"font-size: 22px; font-weight: 900; color: #eef5f0; line-height: 1;\">18</div><div style=\"font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.72);\">Apps</div></div><div style=\"flex: 1; background: rgba(255,255,255,0.08); border-radius: 12px; padding: 11px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px;\"><div style=\"font-size: 22px; font-weight: 900; color: #eef5f0; line-height: 1;\">11</div><div style=\"font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.72);\">Goals</div></div><div style=\"flex: 1; background: rgba(255,255,255,0.08); border-radius: 12px; padding: 11px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px;\"><div style=\"font-size: 22px; font-weight: 900; color: #eef5f0; line-height: 1;\">7</div><div style=\"font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.72);\">Assists</div></div></div>\n      <div style=\"font-size: 11px; color: rgba(255,255,255,0.55); font-weight: 700; position: relative;\">Season 2026 &middot; a football CV on Pitch</div>\n    </div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">First name and one initial. No surname, no club, no age group, no region, no school, no photo of him.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">No link back to his page. Anyone who sees it has to come and find Pitch on their own.</div></div>\n  </div>\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 10px;\"><div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">Say yes and this becomes an image on his phone. He can post it anywhere, and from that point <b style=\"color: #eef5f0;\">we cannot take it back</b> &mdash; no more than we could unsend a photo. That is true of every image on the internet and we would rather you knew it before you tapped, not after.</div></div>\n  <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Approve this card</div>\n  <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; font-weight: 700; font-size: 14px; border-radius: 14px; height: 46px;\">Not this one</div>\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 10px;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7.5 v5\"></path><circle cx=\"12\" cy=\"16.2\" r=\"0.6\" fill=\"#7d8f85\"></circle></svg><div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">Every card he makes comes to you first, and each one separately. Approving this one does not approve the next.</div></div>\n\n</div>", "title": "13 · NEW — approving the card he wants to post", "w": 390}, "WaitlistConfirmed": {"title": "2 · You're on the list", "w": 390, "html": "<div style=\"width: 390px; min-height: 880px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box; position: relative; overflow: hidden;\">\n\n  <div style=\"position: absolute; left: 50%; top: -260px; width: 620px; height: 620px; margin-left: -310px; border: 2px solid rgba(61, 220, 132, 0.07); border-radius: 999px;\"></div>\n  <div style=\"position: absolute; left: 50%; top: -180px; width: 460px; height: 460px; margin-left: -230px; border: 2px solid rgba(61, 220, 132, 0.05); border-radius: 999px;\"></div>\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px; position: relative;\">\n    <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg>\n    <div style=\"font-weight: 800; font-size: 15px;\">Pitch</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; align-items: center; gap: 16px; position: relative; padding-top: 40px;\">\n    <div style=\"width: 72px; height: 72px; border-radius: 999px; background: rgba(61, 220, 132, 0.12); border: 1.5px solid rgba(61, 220, 132, 0.35); display: flex; align-items: center; justify-content: center;\"><svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12.5 L10 17.5 L19.5 7\"></path></svg></div>\n    <div style=\"font-size: 30px; font-weight: 900; line-height: 1.08; letter-spacing: -0.015em; text-align: center; color: #eef5f0;\">You're on<br>the list.</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.6; text-align: center; max-width: 300px;\">We'll email <b style=\"color: #eef5f0;\">you@example.com</b> once, on the day Pitch opens. Nothing before that.</div>\n  </div>\n\n  <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 12px; position: relative;\">\n    <div style=\"font-size: 13.5px; font-weight: 800; color: #eef5f0;\">What happens between now and then</div>\n    <div style=\"display: flex; align-items: flex-start; gap: 10px;\">\n      <div style=\"width: 20px; height: 20px; border-radius: 999px; background: #1a2420; border: 1px solid #24322a; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 10px; font-weight: 900; color: #7d8f85;\">1</div>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Nothing, from us. No newsletter, no countdown, no \"only 200 spots left\".</div>\n    </div>\n    <div style=\"display: flex; align-items: flex-start; gap: 10px;\">\n      <div style=\"width: 20px; height: 20px; border-radius: 999px; background: #1a2420; border: 1px solid #24322a; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 10px; font-weight: 900; color: #7d8f85;\">2</div>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">We hold your email address and the role you picked. That's the whole record, and it isn't shared with anyone.</div>\n    </div>\n    <div style=\"display: flex; align-items: flex-start; gap: 10px;\">\n      <div style=\"width: 20px; height: 20px; border-radius: 999px; background: #1a2420; border: 1px solid #24322a; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 10px; font-weight: 900; color: #7d8f85;\">3</div>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">When we open, you make your own account. Being on this list isn't an account and it doesn't hold a place.</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; align-items: flex-start; gap: 10px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; position: relative;\">\n    <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#a479e2\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><path d=\"M12 2 L20 6 V11 C20 16.5 16.6 20.6 12 22 C7.4 20.6 4 16.5 4 11 V6 Z\"></path><path d=\"M9 12 L11 14 L15 9.5\"></path></svg>\n    <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n      <div style=\"font-size: 12.5px; font-weight: 800; color: #eef5f0;\">Signed up for your child?</div>\n      <div style=\"font-size: 12px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Good — that's the right way round. We don't take a child's details until there's a parent to ask, so nothing about them exists yet. When we open, they build their page and it stays invisible until you approve it.</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 8px; position: relative;\">\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #1a2420; border-radius: 14px; height: 46px; font-size: 14px; font-weight: 700; color: #b9c8bf;\">Change my email or role</div>\n    <div style=\"display: flex; align-items: center; justify-content: center; height: 40px; font-size: 13px; font-weight: 700; color: #7d8f85;\">Take me off the list</div>\n  </div>\n\n  <div style=\"font-size: 11px; color: #6b7d73; text-align: center; font-weight: 700; line-height: 1.6; position: relative;\">Both of these work without an account, from any device.<br>pitchfootball.com.au</div>\n\n</div>"}, "DeskHome": {"title": "1 · Front door", "w": 1440, "html": "<div style=\"width: 1440px; min-height: 1520px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; box-sizing: border-box; display: flex; flex-direction: column;\">\n<div style=\"height: 62px; flex-shrink: 0; border-bottom: 1px solid #24322a; background: #121b16; display: flex; align-items: center; justify-content: space-between; padding: 0 28px;\"><div style=\"display: flex; align-items: center; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div><div style=\"font-size: 13px; font-weight: 700; color: #b9c8bf;\">Sign in</div></div><div style=\"flex: 1; display: flex; justify-content: center;\"><div style=\"width: 640px; display: flex; flex-direction: column; gap: 22px; padding: 34px 24px 70px 24px; box-sizing: border-box;\">\n<div style=\"position: relative; overflow: hidden; border-radius: 22px; background: linear-gradient(160deg, #123326 0%, #0c1d14 60%, #0a1510 100%); padding: 26px 20px 24px 20px; display: flex; flex-direction: column; gap: 14px;\">\n    <div style=\"position: absolute; right: -18px; top: -34px; font-size: 165px; font-weight: 900; color: rgba(61, 220, 132, 0.07); line-height: 1;\">10</div>\n    <div style=\"font-size: 32px; font-weight: 900; line-height: 1.05; letter-spacing: -0.015em; color: #eef5f0; position: relative;\">Somebody should<br>be writing<br>this down.</div>\n    <div style=\"font-size: 14.5px; color: #b9c8bf; font-weight: 500; line-height: 1.6; position: relative;\">Seasons end. Coaches move. Clubs change. The record should be the thing that stays.</div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Who are you?</div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; gap: 13px;\"><div style=\"width: 42px; height: 42px; border-radius: 13px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#d95926\
