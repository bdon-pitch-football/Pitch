: #06130c; border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 900;\">GK</div>\n      <div style=\"border: 1px solid #24322a; color: #7d8f85; border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 700;\">CB</div>\n      <div style=\"border: 1px solid #24322a; color: #7d8f85; border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 700;\">RB</div>\n      <div style=\"border: 1px solid #24322a; color: #7d8f85; border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 700;\">LB</div>\n    </div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Filled in from your CV. Change it if you&rsquo;d play somewhere else for this club.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 8px;\">\n      <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">One line, if you want</div>\n      <div style=\"font-size: 11px; font-weight: 700; color: #7d8f85;\">89 / 140</div>\n    </div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; min-height: 62px;\">\n      <div style=\"font-size: 13.5px; color: #eef5f0; font-weight: 500; line-height: 1.5;\">Full season in goal at Northern United. Out of contract, training Tuesdays and Thursdays.</div>\n    </div>\n  </div>\n\n  <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 11px;\">\n    <div style=\"font-size: 13.5px; font-weight: 800; color: #eef5f0;\">What the club gets</div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">A link to your CV — the live page, not a copy of it.</div>\n    </div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Your name, your age, your club, the squad, where you&rsquo;d play, and your one line.</div>\n    </div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">A reply address that reaches you, and only if they use it.</div>\n    </div>\n    <div style=\"height: 1px; background: #24322a;\"></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e34948\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M6 6 L18 18 M18 6 L6 18\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Not your phone number or your address, and never your birthday.</div>\n    </div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e34948\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M6 6 L18 18 M18 6 L6 18\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Take yourself off and the link stops working the same minute.</div>\n    </div>\n  </div>\n\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 10px;\">\n    <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7.5 v5\"></path><circle cx=\"12\" cy=\"16.2\" r=\"0.6\" fill=\"#7d8f85\"></circle></svg>\n    <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">A register is a list of who wants to be there, not a decision anyone owes you. You stay on it until you take yourself off &mdash; through this season and into the next one.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: auto;\">\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Register my interest</div>\n    <div style=\"display: flex; align-items: center; justify-content: center; color: #7d8f85; font-weight: 700; font-size: 14px; height: 44px;\">Cancel</div>\n  </div>\n\n</div>", "title": "11 · NEW — register interest, no guardian step", "w": 390}, "MyCVAdult": {"html": "<div style=\"width: 390px; min-height: 1420px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px;\">\n    <div style=\"width: 44px; height: 44px; margin: -11px; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5 L8 12 l7 7\"></path></svg></div>\n    <div style=\"display: flex; align-items: center; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -0.015em; color: #eef5f0;\">Where my CV is</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Every club that has your page, and how they got it.</div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 11px;\">\n      <div style=\"display: flex; align-items: center; gap: 12px;\"><div style=\"width: 40px; height: 40px; border-radius: 12px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 900; font-size: 13px; color: #b9c8bf;\">RF</div><div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\"><div style=\"font-size: 14.5px; font-weight: 800; color: #eef5f0;\">Riverside FC</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Seniors · GK</div></div><div style=\"background: rgba(61, 220, 132, 0.14); color: #3ddc84; border-radius: 7px; padding: 4px 9px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0;\">On their register</div></div>\n      <div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 700;\">Registered 24 Aug</div>\n      <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; border-radius: 14px; height: 46px; font-size: 14px; font-weight: 700;\">Take me off this register</div>\n    </div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 11px;\">\n      <div style=\"display: flex; align-items: center; gap: 12px;\"><div style=\"width: 40px; height: 40px; border-radius: 12px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 900; font-size: 13px; color: #b9c8bf;\">WR</div><div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\"><div style=\"font-size: 14.5px; font-weight: 800; color: #eef5f0;\">Westgate Rangers</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Senior Men trial · 12 Oct</div></div><div style=\"background: #1a2420; color: #b9c8bf; border-radius: 7px; padding: 4px 9px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0;\">CV emailed</div></div>\n      <div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 700;\">Sent 16 Aug · football@westgaterangers.com.au</div>\n      <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; border-radius: 14px; height: 46px; font-size: 14px; font-weight: 700;\">Switch this link off</div>\n    </div>\n    <div style=\"background: #121b16; border: 1px solid rgba(227, 73, 72, 0.35); border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 11px;\">\n      <div style=\"display: flex; align-items: center; gap: 12px;\"><div style=\"width: 40px; height: 40px; border-radius: 12px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 900; font-size: 13px; color: #b9c8bf;\">SU</div><div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\"><div style=\"font-size: 14.5px; font-weight: 800; color: #eef5f0;\">Sunbury United</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Over 35s trial · 25 Oct</div></div><div style=\"background: rgba(227, 73, 72, 0.14); color: #e34948; border-radius: 7px; padding: 4px 9px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0;\">Link switched off</div></div>\n      <div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 700;\">You switched it off 22 Aug · it stopped working that minute</div>\n      <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; border-radius: 14px; height: 46px; font-size: 14px; font-weight: 700;\">Give them a new link</div>\n    </div>\n  </div>\n  <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 11px;\">\n      <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px;\"><div style=\"font-size: 13.5px; font-weight: 800; color: #eef5f0;\">Who opened it</div><div style=\"display: flex; align-items: center; gap: 6px;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><rect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"10\" rx=\"2.5\"></rect><path d=\"M8 10.5 V7.5 a4 4 0 0 1 8 0 v3\"></path></svg><div style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">Pro · December</div></div></div>\n      <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">See which clubs actually opened your CV, and when. Your record, your data &mdash; and only ever your own.</div>\n  </div>\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 10px;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7.5 v5\"></path><circle cx=\"12\" cy=\"16.2\" r=\"0.6\" fill=\"#7d8f85\"></circle></svg><div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">Nobody else can switch these off for you. At eighteen the controls are entirely yours, which also means nobody is checking them but you.</div></div>\n\n</div>", "title": "12 · NEW — where my CV is, 18+", "w": 390}, "Invite1617": {"html": "<div style=\"width: 390px; min-height: 1440px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div>\n  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3ddc84;\">For you, Nate</div>\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -0.015em; color: #eef5f0;\">Riverside FC would like you at a trial</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Your mum has been told this arrived. She hasn&rsquo;t read it and she can&rsquo;t answer it &mdash; this one is yours.</div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"background: #121b16; border: 1px solid #3ddc84; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"display: flex; align-items: center; gap: 13px; margin-bottom: 13px;\"><div style=\"width: 44px; height: 44px; border-radius: 13px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 900; font-size: 14px; color: #b9c8bf;\">RF</div><div style=\"display: flex; flex-direction: column; gap: 3px;\"><div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">Riverside FC</div><div style=\"display: flex; align-items: center; gap: 5px;\"><div style=\"width: 6px; height: 6px; border-radius: 999px; background: #3ddc84;\"></div><div style=\"font-size: 11px; font-weight: 800; color: #3ddc84;\">Verified club</div></div></div></div>\n      <div style=\"height: 1px; background: #24322a;\"></div>\n      <div style=\"display: flex; gap: 24px; padding: 13px 0;\"><div style=\"display: flex; flex-direction: column; gap: 3px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Squad</div><div style=\"font-size: 14.5px; color: #eef5f0; font-weight: 700;\">Seniors</div></div><div style=\"display: flex; flex-direction: column; gap: 3px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Trial</div><div style=\"font-size: 14.5px; color: #eef5f0; font-weight: 700;\">Sun 11 Oct, 11:30 AM</div></div></div>\n      <div style=\"height: 1px; background: #24322a;\"></div>\n      <div style=\"padding-top: 13px; font-size: 13.5px; color: #eef5f0; font-weight: 500; line-height: 1.55;\">&ldquo;We&rsquo;re short a keeper for the seniors and we liked what we saw of your season. Come and train with us.&rdquo;</div>\n    </div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">You answer this yourself. At sixteen that is your call, not hers.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">She was told a verified club got in touch. She was not shown what they said.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">She can still switch your sending off entirely, and you would see that on your account.</div></div>\n  </div>\n  <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Reply to Riverside FC</div>\n  <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; font-weight: 700; font-size: 14px; border-radius: 14px; height: 46px;\">Not this one</div>\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 10px;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7.5 v5\"></path><circle cx=\"12\" cy=\"16.2\" r=\"0.6\" fill=\"#7d8f85\"></circle></svg><div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">If you would rather she handled it, forward it to her from here. Plenty of players do and there is nothing odd about it.</div></div>\n\n</div>", "title": "13 · NEW — a club invites a 16–17 player", "w": 390}, "InviteAdult": {"html": "<div style=\"width: 390px; min-height: 1280px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div>\n  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3ddc84;\">For you</div>\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -0.015em; color: #eef5f0;\">Westgate Rangers want you at a trial</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">They found you on their register. No one else is in this conversation.</div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"background: #121b16; border: 1px solid #3ddc84; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"display: flex; align-items: center; gap: 13px; margin-bottom: 13px;\"><div style=\"width: 44px; height: 44px; border-radius: 13px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 900; font-size: 14px; color: #b9c8bf;\">WR</div><div style=\"display: flex; flex-direction: column; gap: 3px;\"><div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">Westgate Rangers</div><div style=\"display: flex; align-items: center; gap: 5px;\"><div style=\"width: 6px; height: 6px; border-radius: 999px; background: #3ddc84;\"></div><div style=\"font-size: 11px; font-weight: 800; color: #3ddc84;\">Verified club</div></div></div></div>\n      <div style=\"height: 1px; background: #24322a;\"></div>\n      <div style=\"padding: 13px 0; font-size: 13.5px; color: #eef5f0; font-weight: 500; line-height: 1.55;\">&ldquo;Senior Men, Mon 12 Oct, 7:15pm at Grant Reserve. Bring boots and a GK top. Ask for Dan.&rdquo;</div>\n      <div style=\"height: 1px; background: #24322a;\"></div>\n      <div style=\"padding-top: 13px; display: flex; flex-direction: column; gap: 5px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">They gave you</div><div style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; color: #3ddc84; font-weight: 700;\">dan@westgaterangers.com.au</div></div>\n    </div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">At eighteen a club may hand you a contact address. You decide whether to give yours back.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Your CV link is separate. Replying here does not change who can open it.</div></div>\n  </div>\n  <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Reply and share my number</div>\n  <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; font-weight: 700; font-size: 14px; border-radius: 14px; height: 46px;\">Reply without my number</div>\n  <div style=\"display: flex; align-items: center; justify-content: center; color: #7d8f85; font-weight: 700; font-size: 14px; height: 44px;\">Not interested</div>\n\n</div>", "title": "14 · NEW — a club invites an adult", "w": 390}, "JoinWaitlist": {"html": "<div style=\"width: 390px; min-height: 1150px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box; position: relative; overflow: hidden;\">\n\n  <div style=\"position: absolute; left: 50%; top: -260px; width: 620px; height: 620px; margin-left: -310px; border: 2px solid rgba(61, 220, 132, 0.07); border-radius: 999px;\"></div>\n  <div style=\"position: absolute; left: 50%; top: -180px; width: 460px; height: 460px; margin-left: -230px; border: 2px solid rgba(61, 220, 132, 0.05); border-radius: 999px;\"></div>\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px; position: relative;\">\n    <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg>\n    <div style=\"font-weight: 800; font-size: 15px;\">Pitch</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px; position: relative; padding-top: 14px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3ddc84;\">In build · Australia first</div>\n    <div style=\"font-size: 34px; font-weight: 900; line-height: 1.06; letter-spacing: -0.015em; color: #eef5f0;\">Somebody should<br>be writing<br>this down.</div>\n    <div style=\"font-size: 14.5px; color: #b9c8bf; font-weight: 500; line-height: 1.6; max-width: 330px;\">Seasons end. Coaches move. Clubs change. Pitch is the record that stays — a football CV that belongs to the player, not the club.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 8px; position: relative;\">\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"width: 38px; height: 38px; border-radius: 11px; background: rgba(61, 220, 132, 0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"6.5\" r=\"3\"></circle><path d=\"M12 10 V15 M12 15 L8 20 M12 15 L16.5 18.5 M6 12.5 L12 11 M18 11.5 L12 11\"></path></svg></div>\n      <div style=\"display: flex; flex-direction: column; gap: 1px;\"><div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Players</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Two minutes to a CV worth sending — whatever level the game finds you at</div></div>\n    </div>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"width: 38px; height: 38px; border-radius: 11px; background: rgba(61, 220, 132, 0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"7\" r=\"2.6\"></circle><circle cx=\"16.5\" cy=\"9\" r=\"2.1\"></circle><path d=\"M4.5 20 C4.5 15.5 6.5 13.5 9 13.5 C11.5 13.5 13.5 15.5 13.5 20 M14.5 20 C14.5 16.8 15.4 14.8 16.5 14.8 C18.4 14.8 19.8 16.5 19.8 20\"></path></svg></div>\n      <div style=\"display: flex; flex-direction: column; gap: 1px;\"><div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Parents</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Every season, every club, in one record that belongs to them — and nothing goes live without you</div></div>\n    </div>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"width: 38px; height: 38px; border-radius: 11px; background: rgba(61, 220, 132, 0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 21 V4 M6 4 H17 L15 7 L17 10 H6\"></path><path d=\"M3.5 21 H10\"></path></svg></div>\n      <div style=\"display: flex; flex-direction: column; gap: 1px;\"><div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Coaches &amp; clubs</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">A coaching CV that opens doors, a digital home ground, trials in one place</div></div>\n    </div>\n  </div>\n\n  <div style=\"background: linear-gradient(160deg, #123326, #0c1d14); border-radius: 18px; padding: 18px 17px; display: flex; flex-direction: column; gap: 10px; position: relative;\">\n    <div style=\"font-size: 17px; font-weight: 900; color: #eef5f0;\">Be there for kick-off</div>\n    <div style=\"background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 12px; padding: 11px 14px; display: flex; flex-direction: column; gap: 2px;\">\n      <div style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255, 255, 255, 0.55);\">Email · 18+ only</div>\n      <div style=\"font-size: 14px; color: rgba(255, 255, 255, 0.45); font-weight: 500;\">you@example.com</div>\n    </div>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n      <div style=\"background: #3ddc84; color: #06130c; border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 900;\">Player</div>\n      <div style=\"border: 1px solid rgba(255, 255, 255, 0.25); color: rgba(255, 255, 255, 0.8); border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 700;\">Parent</div>\n      <div style=\"border: 1px solid rgba(255, 255, 255, 0.25); color: rgba(255, 255, 255, 0.8); border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 700;\">Coach</div>\n      <div style=\"border: 1px solid rgba(255, 255, 255, 0.25); color: rgba(255, 255, 255, 0.8); border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 700;\">Club</div>\n    </div>\n    <div style=\"background: #3ddc84; color: #06130c; border-radius: 13px; padding: 15px; text-align: center; font-size: 15px; font-weight: 900;\">Join the waitlist</div>\n    <div style=\"font-size: 11px; color: rgba(255, 255, 255, 0.55); font-weight: 500; line-height: 1.5;\">Under 18? Ask a parent to add their email here — we never take a child’s details before there is a parent to ask. When we open you sign up yourself, and a parent approves the profile. One email, no spam, unsubscribe any time.</div>\n  </div>\n\n  <div style=\"display: flex; align-items: center; justify-content: center; gap: 7px; position: relative;\">\n    <div style=\"width: 6px; height: 6px; border-radius: 999px; background: #3ddc84;\"></div>\n    <div style=\"font-size: 12px; font-weight: 700; color: #7d8f85;\">We'll email you once, when it opens. That's the only one you get.</div>\n  </div>\n\n  <div style=\"font-size: 11px; color: #3a4a42; text-align: center; font-weight: 700; position: relative;\">pitchfootball.com.au</div>\n\n</div>", "title": "1 · The pre-launch page — AU waitlist", "w": 390}, "Waitlist": {"html": "<div style=\"width: 390px; min-height: 860px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box; position: relative; overflow: hidden;\">\n\n  <div style=\"position: absolute; left: -160px; top: 240px; width: 700px; height: 700px; border: 2px solid rgba(61, 220, 132, 0.06); border-radius: 999px;\"></div>\n  <div style=\"position: absolute; left: -60px; top: 340px; width: 500px; height: 500px; border: 2px solid rgba(61, 220, 132, 0.05); border-radius: 999px;\"></div>\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px; position: relative;\">\n    <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg>\n    <div style=\"font-weight: 800; font-size: 15px;\">Pitch</div>\n  </div>\n\n  <div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 0; padding-top: 10px;\">\n    <div style=\"width: 250px; background: #050807; border: 2px solid #24322a; border-radius: 20px; padding: 18px 20px 16px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 0 60px rgba(61, 220, 132, 0.15), inset 0 0 30px rgba(0, 0, 0, 0.6);\">\n      <div style=\"display: flex; align-items: center; gap: 8px;\">\n        <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"#3ddc84\" style=\"filter: drop-shadow(0 0 8px rgba(61, 220, 132, 0.9));\"><path d=\"M12 3 L20 13 H15 V21 H9 V13 H4 Z\"></path></svg>\n        <div style=\"font-size: 11px; font-weight: 900; letter-spacing: 0.14em; color: #3ddc84; text-shadow: 0 0 12px rgba(61, 220, 132, 0.9);\">COMING ON</div>\n      </div>\n      <div style=\"font-size: 74px; font-weight: 900; line-height: 0.95; color: #3ddc84; letter-spacing: 0.06em; text-shadow: 0 0 22px rgba(61, 220, 132, 0.85), 0 0 60px rgba(61, 220, 132, 0.4);\">YOU</div>\n      <div style=\"width: 100%; border-top: 1px solid #1a2420; padding-top: 9px; display: flex; justify-content: space-between; align-items: center;\">\n        <div style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.14em; color: #6b7d73;\">PITCH · WORLD XI</div>\n        <div style=\"display: flex; align-items: center; gap: 5px;\">\n          <div style=\"width: 6px; height: 6px; border-radius: 999px; background: #3ddc84; box-shadow: 0 0 8px rgba(61, 220, 132, 0.9);\"></div>\n          <div style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.14em; color: #7d8f85;\">WARMING UP</div>\n        </div>\n      </div>\n    </div>\n    <div style=\"width: 3px; height: 26px; background: linear-gradient(180deg, #24322a, transparent);\"></div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; text-align: center;\">\n    <div style=\"font-size: 30px; font-weight: 900; line-height: 1.05; color: #eef5f0;\">You're on the bench.</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55; max-width: 300px;\">Pitch is live in Australia first. The rest of the world is warming up — and you're first in line for the call.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 8px; position: relative;\">\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 2px;\">\n      <div style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">Your country</div>\n      <div style=\"font-size: 15px; font-weight: 700; color: #eef5f0;\">United Kingdom</div>\n    </div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 2px;\">\n      <div style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">Email · 18+ only</div>\n      <div style=\"font-size: 15px; color: #6b7d73; font-weight: 500;\">you@example.com</div>\n    </div>\n    <div style=\"background: #3ddc84; color: #06130c; border-radius: 15px; padding: 15px; text-align: center; font-size: 15px; font-weight: 900; box-shadow: 0 0 30px rgba(61, 220, 132, 0.25);\">Sub me on when Pitch arrives</div>\n  </div>\n\n  <div style=\"position: relative; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; gap: 11px; align-items: flex-start;\">\n    <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M12 2 L20 6 V11 C20 16.5 16.6 20.6 12 22 C7.4 20.6 4 16.5 4 11 V6 Z\"></path><path d=\"M9 12 L11 14 L15 9.5\"></path></svg>\n    <div style=\"font-size: 12px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\"><span style=\"color: #eef5f0; font-weight: 800;\">Under 18?</span> Ask a parent to leave their email — we never take a child's details.</div>\n  </div>\n\n</div>", "title": "3 · Overseas — the bench (post-launch)", "w": 390}, "LandingCoach": {"html": "<div style=\"width: 390px; min-height: 1500px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px; padding: 22px 18px 34px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px;\">\n    <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg>\n    <div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div>\n  </div>\n\n  <div style=\"position: relative; overflow: hidden; border-radius: 22px; background: linear-gradient(160deg, #123326 0%, #0c1d14 60%, #0a1510 100%); padding: 26px 20px 24px 20px; display: flex; flex-direction: column; gap: 14px;\">\n    <div style=\"position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #3987e5;\"></div>\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3987e5;\">For coaches</div>\n    <div style=\"font-size: 32px; font-weight: 900; line-height: 1.05; letter-spacing: -0.015em; color: #eef5f0;\">Six years of<br>coaching, on<br>one page.</div>\n    <div style=\"font-size: 14.5px; color: #b9c8bf; font-weight: 500; line-height: 1.6;\">Clubs, squads, badges, the way you actually want to play. Hiring season runs September to December, and a coach with nothing written down turns up to it with a text message.</div>\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px; margin-top: 4px;\">Build my coach CV — free</div>\n  </div>\n\n  <div style=\"position: relative; overflow: hidden; border-radius: 16px; background: #121b16; border: 1px solid #24322a; padding: 15px 14px; display: flex; flex-direction: column; gap: 14px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3ddc84;\">One link, two jobs</div>\n\n    <div style=\"display: flex; align-items: flex-start; gap: 12px;\">\n      <div style=\"width: 34px; height: 34px; border-radius: 11px; background: rgba(57, 135, 229, 0.16); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3987e5\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"7.5\" width=\"18\" height=\"12.5\" rx=\"2.5\"></rect><path d=\"M9 7.5 V5.5 a1.5 1.5 0 0 1 1.5 -1.5 h3 A1.5 1.5 0 0 1 15 5.5 v2\"></path></svg></div>\n      <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n        <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Going for a job</div>\n        <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Send it to a club instead of a paragraph in WhatsApp. It exports to PDF too, for the clubs that still want one attached.</div>\n      </div>\n    </div>\n\n    <div style=\"height: 1px; background: #24322a;\"></div>\n\n    <div style=\"display: flex; align-items: flex-start; gap: 12px;\">\n      <div style=\"width: 34px; height: 34px; border-radius: 11px; background: rgba(57, 135, 229, 0.16); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3987e5\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"8\" r=\"3\"></circle><path d=\"M3.5 20 c0 -4.5 2.5 -7 5.5 -7 s5.5 2.5 5.5 7\"></path><path d=\"M17 9 h5 M19.5 6.5 v5\"></path></svg></div>\n      <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n        <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Building a squad</div>\n        <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Copy the link into the group chat, the club newsletter, wherever you already talk to families. A parent deciding where to send their kid can read who you are before they meet you.</div>\n      </div>\n    </div>\n\n    <div style=\"display: flex; align-items: flex-start; gap: 10px; background: #1a2420; border-radius: 12px; padding: 12px 14px;\">\n      <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 8 v5\"></path><circle cx=\"12\" cy=\"16\" r=\"0.6\" fill=\"#7d8f85\"></circle></svg>\n      <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">You copy your link and share it yourself. Pitch never sends it for you, and never gives you a player's or family's contact details.</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3ddc84;\">Verified means something</div>\n    <div style=\"display: flex; align-items: flex-start; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"width: 34px; height: 34px; border-radius: 11px; background: rgba(61, 220, 132, 0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3 l7.5 3 v6 c0 4.5 -3.2 7.8 -7.5 9 c-4.3 -1.2 -7.5 -4.5 -7.5 -9 V6 Z\"></path><path d=\"M8.8 12 l2.2 2.2 l4.2 -4.4\"></path></svg></div>\n      <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n        <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Your check, confirmed by your club</div>\n        <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Your club confirms you hold a current check, and that is all anyone sees. The number itself is never shown or stored. <span style=\"color: #b9c8bf; font-weight: 700;\">Free on every tier.</span></div>\n      </div>\n    </div>\n  </div>\n\n  <div style=\"height: 1px; background: #24322a;\"></div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3ddc84;\">What it costs</div>\n    <div style=\"display: flex; gap: 10px;\">\n      <div style=\"flex: 1; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 8px;\">\n        <div style=\"font-size: 13px; font-weight: 800; color: #eef5f0;\">Free</div>\n        <div style=\"font-size: 24px; font-weight: 900; color: #eef5f0; line-height: 1;\">$0</div>\n        <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">The whole coach CV, your public link, and verification. Everything a volunteer coach needs.</div>\n      </div>\n      <div style=\"flex: 1; background: #121b16; border: 1px solid #2f6d4c; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 8px;\">\n        <div style=\"font-size: 13px; font-weight: 800; color: #eda100;\">Pro · Coming December</div>\n        <div style=\"font-size: 24px; font-weight: 900; color: #eef5f0; line-height: 1;\">$79<span style=\"font-size: 13px; font-weight: 700; color: #7d8f85;\">/yr</span></div>\n        <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\"><span style=\"display: flex; align-items: center; gap: 5px; margin-bottom: 4px;\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><rect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"10\" rx=\"2.5\"></rect><path d=\"M8 10.5 V7.5 a4 4 0 0 1 8 0 v3\"></path></svg><span style=\"font-weight: 700; color: #b9c8bf;\">See which clubs opened your CV</span></span><span style=\"display: flex; align-items: center; gap: 5px;\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><rect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"10\" rx=\"2.5\"></rect><path d=\"M8 10.5 V7.5 a4 4 0 0 1 8 0 v3\"></path></svg><span style=\"font-weight: 700; color: #b9c8bf;\">Verified references from your clubs</span></span> <b style=\"color: #b9c8bf;\">Opens December</b> — tap to be first in line.</div>\n      </div>\n    </div>\n  </div>\n\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 13px;\">\n    <div style=\"display: inline-flex; align-items: center; gap: 7px; background: rgba(237, 161, 0, 0.14); border-radius: 999px; padding: 5px 11px; align-self: flex-start;\"><div style=\"width: 6px; height: 6px; border-radius: 999px; background: #eda100;\"></div><div style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">Coming soon</div></div>\n    <div style=\"display: flex; flex-direction: column; gap: 10px;\"><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 700; line-height: 1.45;\">Every season you coach becomes proof when you go for the next job</div></div><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 700; line-height: 1.45;\">A whole squad tracked in fifteen minutes</div></div><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 700; line-height: 1.45;\">The game-time question answered before a parent asks it</div></div><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 700; line-height: 1.45;\">You see your own record before your club does</div></div><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 700; line-height: 1.45;\">One place for your squad, instead of three group chats</div></div></div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 4px;\">\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Build my coach CV — free</div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; text-align: center;\">Australia first</div>\n  </div>\n\n</div>", "title": "1 · Landing — coach", "w": 390}, "SignUpCoach": {"html": "<div style=\"width: 390px; min-height: 900px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px;\">\n    <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg>\n    <div style=\"font-weight: 800; font-size: 15px;\">Pitch</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 5px;\">\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; color: #eef5f0;\">What's your position?</div>\n    <div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 500;\">Coaches build a career CV. Your club confirms your check — you never send us the number.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"width: 40px; height: 40px; border-radius: 12px; background: #1a2420; display: flex; align-items: center; justify-content: center;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"6.5\" r=\"3\"></circle><path d=\"M12 10 V15 M12 15 L8 20 M12 15 L16.5 18.5 M6 12.5 L12 11 M18 11.5 L12 11\"></path></svg></div>\n      <div style=\"display: flex; flex-direction: column; gap: 1px;\"><div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">Player</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Build your football CV</div></div>\n    </div>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #121b16; border: 1.5px solid #3ddc84; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"width: 40px; height: 40px; border-radius: 12px; background: rgba(61, 220, 132, 0.14); display: flex; align-items: center; justify-content: center;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"4\" width=\"12\" height=\"17\" rx=\"2\"></rect><path d=\"M9.5 4 V2.8 H14.5 V4 M9 9 H15 M9 12.5 H15 M9 16 H12.5\"></path></svg></div>\n      <div style=\"display: flex; flex-direction: column; gap: 1px;\"><div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">Coach</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Develop your squad</div></div>\n    </div>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"width: 40px; height: 40px; border-radius: 12px; background: #1a2420; display: flex; align-items: center; justify-content: center;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"7\" r=\"2.6\"></circle><circle cx=\"16.5\" cy=\"9\" r=\"2.1\"></circle><path d=\"M4.5 20 C4.5 15.5 6.5 13.5 9 13.5 C11.5 13.5 13.5 15.5 13.5 20 M14.5 20 C14.5 16.8 15.4 14.8 16.5 14.8 C18.4 14.8 19.8 16.5 19.8 20\"></path></svg></div>\n      <div style=\"display: flex; flex-direction: column; gap: 1px;\"><div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">Parent / Guardian</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Approve and see their record</div></div>\n    </div>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"width: 40px; height: 40px; border-radius: 12px; background: #1a2420; display: flex; align-items: center; justify-content: center;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 21 V4 M6 4 H17 L15 7 L17 10 H6\"></path><path d=\"M3.5 21 H10\"></path></svg></div>\n      <div style=\"display: flex; flex-direction: column; gap: 1px;\"><div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">Club</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Your club's home ground</div></div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 8px; margin-top: 4px;\">\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 2px;\">\n      <div style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">Date of birth</div>\n      <div style=\"font-size: 15px; color: #6b7d73; font-weight: 500;\">DD / MM / YYYY</div>\n    </div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Your club confirms your Working With Children Check. Nothing to do with players unlocks until they do.</div>\n  </div>\n\n  <div style=\"display: flex; align-items: center; gap: 9px; margin-top: 2px;\">\n    <div style=\"width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid #3a4a42; flex-shrink: 0;\"></div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">I agree to the <span style=\"color: #3ddc84; font-weight: 700;\">Terms</span> and <span style=\"color: #3ddc84; font-weight: 700;\">Privacy Policy</span></div>\n  </div>\n\n  <div style=\"background: #3ddc84; color: #06130c; border-radius: 15px; padding: 15px; text-align: center; font-size: 15px; font-weight: 900; margin-top: 2px;\">Continue</div>\n\n</div>", "title": "2 · Sign up — Coach door", "w": 390}, "BuildCoachCV": {"html": "<div style=\"width: 390px; min-height: 1580px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px;\">\n    <div style=\"width: 44px; height: 44px; margin: -11px; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5 L8 12 l7 7\"></path></svg></div>\n    <div style=\"display: flex; align-items: center; gap: 8px;\">\n      <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg>\n      <div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -0.015em; color: #eef5f0;\">Build your coach CV</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Five minutes. Edit anything later.</div>\n  </div>\n\n  <div style=\"display: flex; gap: 11px;\">\n    <div style=\"width: 76px; height: 76px; border-radius: 20px; border: 1px dashed #3a4a42; display: flex ex-direction: column; gap: 8px;\">\n      <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px;\">\n        <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Head Coach · U15 Boys</div>\n        <div style=\"background: rgba(61, 220, 132, 0.14); color: #3ddc84; border-radius: 6px; padding: 3px 7px; font-size: 9px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;\">Current</div>\n      </div>\n      <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500;\">Riverside FC · 2024 — now</div>\n    </div>\n\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 6px;\">\n      <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Assistant Coach · U14 Boys</div>\n      <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500;\">Northern United SC · 2021 — 2023</div>\n    </div>\n\n    <div style=\"border: 1px dashed #3a4a42; border-radius: 14px; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5 v14 M5 12 h14\"></path></svg>\n      <div style=\"font-size: 13px; color: #7d8f85; font-weight: 700;\">Add a role</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">Badges</div>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n      <div style=\"background: #3ddc84; color: #06130c; border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 900;\">AFC C Diploma</div>\n      <div style=\"border: 1px solid #24322a; color: #7d8f85; border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 700;\">AFC B Diploma</div>\n      <div style=\"border: 1px solid #24322a; color: #7d8f85; border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 700;\">Community C</div>\n      <div style=\"border: 1px dashed #3a4a42; color: #6b7d73; border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 700;\">+ Other</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">How you want to play</div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Possession with purpose. Every player touches the ball every drill, every session — confidence first, patterns second.</div>\n    </div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">The part a technical director actually reads, and the part a parent decides on. Say it the way you'd say it at the coffee.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">Working With Children Check</div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 12px;\">\n      <div style=\"display: flex; align-items: center; gap: 12px;\">\n        <div style=\"width: 36px; height: 36px; border-radius: 11px; background: rgba(237, 161, 0, 0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#eda100\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3 l7.5 3 v6 c0 4.5 -3.2 7.8 -7.5 9 c-4.3 -1.2 -7.5 -4.5 -7.5 -9 V6 Z\"></path><path d=\"M12 9 v4\"></path><circle cx=\"12\" cy=\"16\" r=\"0.7\" fill=\"#eda100\"></circle></svg></div>\n        <div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\">\n          <div style=\"font-size: 14.5px; font-weight: 800; color: #eef5f0;\">Waiting on Riverside FC</div>\n          <div style=\"font-size: 12px; color: #eda100; font-weight: 700;\">Asked 26 August</div>\n        </div>\n      </div>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\"><b style=\"color: #eef5f0;\">Your club confirms it, not you.</b> We asked Riverside FC to confirm you hold a current check. Don't send us the number — we don't store it and there's nowhere to put it.</div>\n      <div style=\"display: flex; gap: 8px;\">\n        <div style=\"flex: 1; border: 1px solid #24322a; color: #b9c8bf; border-radius: 12px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;\">Ask again</div>\n        <div style=\"flex: 1; border: 1px solid #24322a; color: #b9c8bf; border-radius: 12px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;\">Different club</div>\n      </div>\n    </div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Your CV publishes without it. Verification is what unlocks anything to do with players, and it's free on every tier.</div>\n  </div>\n\n  <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px; margin-top: auto;\">Save &amp; preview</div>\n\n</div>", "title": "3 · NEW — build your coach CV", "w": 390}, "CoachCV": {"html": "<div style=\"width: 390px; min-height: 1110px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display:
