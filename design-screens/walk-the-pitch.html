: 16px; padding: 15px 14px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 1px; flex-grow: 1;\"><div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Head Coach · U15 Boys</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Riverside FC · 2024 — now</div></div>\n      <div style=\"font-size: 10px; font-weight: 900; color: #3ddc84; letter-spacing: 0.06em;\">CURRENT</div>\n    </div>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 1px;\"><div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Assistant Coach · U14 Boys</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Northern United SC · 2021 — 2023</div></div>\n    </div>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 1px;\"><div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Junior Coach · MiniRoos</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Northern United SC · 2018 — 2021</div></div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"display: inline-flex; align-items: center; gap: 7px; background: rgba(237, 161, 0, 0.14); border-radius: 999px; padding: 5px 11px;\"><div style=\"width: 6px; height: 6px; border-radius: 999px; background: #eda100;\"></div><div style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">Coming December</div></div>\n    <div style=\"display: flex; align-items: center; gap: 10px; background: #121b16; border-radius: 13px; padding: 12px 14px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 19 L9 13 L13 16 L20 7\"></path><path d=\"M15 7 H20 V12\"></path></svg>\n      <div style=\"font-size: 13px; font-weight: 700; color: #b9c8bf;\">Players developed · improvement delivered</div>\n      <div style=\"margin-left: auto; font-size: 10px; font-weight: 900; color: #3ddc84; letter-spacing: 0.06em;\">DEC</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n    <div style=\"background: #121b16; border: 1.5px solid #3ddc84; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 3px;\">\n      <div style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">Public coaching CV link</div>\n      <div style=\"font-size: 14px; font-weight: 800; color: #3ddc84;\">pitchfootball.com.au/sam-kaya</div>\n    </div>\n    <div style=\"display: grid; grid-template-columns: 1fr 118px; gap: 8px;\"><div style=\"background: #3ddc84; color: #06130c; border-radius: 15px; padding: 15px; text-align: center; font-size: 15px; font-weight: 900;\">Share my CV</div><div style=\"background: #121b16; border: 1px solid #24322a; color: #eef5f0; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 13.5px; font-weight: 800;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3 V15 M12 15 L8 11 M12 15 L16 11\"></path><path d=\"M4 17 V20 H20 V17\"></path></svg>PDF</div></div>\n  </div>\n\n  <div style=\"font-size: 11px; color: #3a4a42; text-align: center; font-weight: 700;\">Report this page</div>\n\n</div>", "title": "4 · The finished coach CV", "w": 390}, "JoinClub": {"html": "<div style=\"width: 390px; min-height: 1300px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px;\">\n    <div style=\"width: 44px; height: 44px; margin: -11px; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5 L8 12 l7 7\"></path></svg></div>\n    <div style=\"display: flex; align-items: center; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3987e5;\">Joining a club</div>\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -0.015em; color: #eef5f0;\">Riverside FC invited you</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Tell them which squads you take. They confirm it, and their name goes on your CV.</div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Which squads do you take?</div>\n    <div style=\"background: #121b16; border: 1px solid #3ddc84; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; gap: 12px;\"><div style=\"width: 20px; height: 20px; border-radius: 6px; border: 2px solid #3ddc84; background: #3ddc84; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg></div><div style=\"font-size: 14.5px; font-weight: 800; color: #eef5f0;\">U14 Boys</div></div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; gap: 12px;\"><div style=\"width: 20px; height: 20px; border-radius: 6px; border: 2px solid #3a4a42; background: transparent; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"></div><div style=\"font-size: 14.5px; font-weight: 700; color: #b9c8bf;\">U15 Boys</div></div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; gap: 12px;\"><div style=\"width: 20px; height: 20px; border-radius: 6px; border: 2px solid #3a4a42; background: transparent; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"></div><div style=\"font-size: 14.5px; font-weight: 700; color: #b9c8bf;\">U16 Girls</div></div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; gap: 12px;\"><div style=\"width: 20px; height: 20px; border-radius: 6px; border: 2px solid #3a4a42; background: transparent; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"></div><div style=\"font-size: 14.5px; font-weight: 700; color: #b9c8bf;\">Seniors Men</div></div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Nothing goes on your CV until Riverside FC confirms it.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Your CV is yours. Leaving the club does not delete the season you coached.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e34948\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M6 6 L18 18 M18 6 L6 18\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">You will not see a single player until the club confirms your check as well.</div></div>\n  </div>\n  <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Ask Riverside FC to confirm</div>\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 10px;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7.5 v5\"></path><circle cx=\"12\" cy=\"16.2\" r=\"0.6\" fill=\"#7d8f85\"></circle></svg><div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">Two different confirmations, and clubs mix them up: one says you coach here, the other says you hold a current Working With Children Check. Only the second unlocks anything to do with players.</div></div>\n\n</div>", "title": "5 · NEW — a coach joins a club", "w": 390}, "LandingClub": {"html": "<div style=\"width: 390px; min-height: 2380px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px; padding: 22px 18px 34px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px;\">\n    <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg>\n    <div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div>\n  </div>\n\n  <div style=\"position: relative; overflow: hidden; border-radius: 22px; background: linear-gradient(160deg, #123326 0%, #0c1d14 60%, #0a1510 100%); padding: 26px 20px 24px 20px; display: flex; flex-direction: column; gap: 14px;\">\n    <div style=\"position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #eda100;\"></div>\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">For clubs &amp; technical directors</div>\n    <div style=\"font-size: 32px; font-weight: 900; line-height: 1.05; letter-spacing: -0.015em; color: #eef5f0;\">Put your trials<br>where families<br>can find them.</div>\n    <div style=\"font-size: 14.5px; color: #b9c8bf; font-weight: 500; line-height: 1.6;\">Claim your club’s page, put your trial dates on it, and give families one place to check that isn’t a Facebook post they had to be following you to see.</div>\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px; margin-top: 4px;\">Claim your club page</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3ddc84;\">What a claimed page carries</div>\n    <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n      <div style=\"display: flex; align-items: flex-start; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n        <div style=\"width: 34px; height: 34px; border-radius: 11px; background: rgba(237, 161, 0, 0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#eda100\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15.5\" rx=\"2.5\"></rect><path d=\"M3.5 9.5 h17\"></path><path d=\"M8 3.5 v3 M16 3.5 v3\"></path></svg></div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Trial notices</div>\n          <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Age group, date, ground, and the positions you're actually short of. Listings expire on their own, so nobody turns up to a trial that happened last month.</div>\n        </div>\n      </div>\n      <div style=\"display: flex; align-items: flex-start; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n        <div style=\"width: 34px; height: 34px; border-radius: 11px; background: rgba(237, 161, 0, 0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#eda100\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"8\" cy=\"8\" r=\"2.6\"></circle><circle cx=\"16\" cy=\"8\" r=\"2.6\"></circle><path d=\"M3 19 c0 -3.4 2 -5.6 5 -5.6 s5 2.2 5 5.6\"></path><path d=\"M12.5 19 c0 -3.4 1.6 -5.6 3.5 -5.6 s5 2.2 5 5.6\"></path></svg></div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Every squad you run</div>\n          <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">MiniRoos through to seniors, each team a row of its own. Add one, retire one, in a tap.</div>\n        </div>\n      </div>\n      <div style=\"display: flex; align-items: flex-start; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n        <div style=\"width: 34px; height: 34px; border-radius: 11px; background: rgba(237, 161, 0, 0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#eda100\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20 V13 M4 13 l7 -4 l4 2.2 l5 -2.8\"></path><path d=\"M4 13 V6.5 l7 -3.5 l4 2.2 l5 -2.7 V9\"></path></svg></div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Who you've produced</div>\n          <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">The pathway wall — where your juniors went on to.</div>\n        </div>\n      </div>\n    </div>\n  </div>\n\n  <div style=\"position: relative; overflow: hidden; border-radius: 20px; background: linear-gradient(160deg, #123326 0%, #0c1d14 70%, #0a1510 100%); border: 1px solid #24322a; padding: 20px 18px; display: flex; flex-direction: column; gap: 15px;\">\n    <div style=\"position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #eda100;\"></div>\n    <div style=\"display: flex; flex-direction: column; gap: 7px; position: relative;\">\n      <div style=\"display: inline-flex; align-items: center; gap: 7px; background: rgba(237, 161, 0, 0.14); border-radius: 999px; padding: 5px 11px; align-self: flex-start;\"><div style=\"width: 6px; height: 6px; border-radius: 999px; background: #eda100;\"></div><div style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">Founding XI</div></div>\n      <div style=\"font-size: 21px; font-weight: 900; color: #eef5f0; line-height: 1.15; letter-spacing: -0.015em;\">Be one of the first eleven clubs</div>\n      <div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 500; line-height: 1.6;\">Eleven clubs shape what Pitch becomes. You sit in the room on the roadmap &mdash; what gets built next, and what gets built at all &mdash; because a technical director knows what this game needs better than we do. A pillar under a product built to make football better for everyone in it: the player, the parent, the coach and the club.</div>\n    </div>\n\n    <div style=\"display: flex; align-items: flex-start; gap: 10px; background: #1a2420; border-radius: 12px; padding: 12px 14px; position: relative;\">\n      <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 8 v5\"></path><circle cx=\"12\" cy=\"16\" r=\"0.6\" fill=\"#7d8f85\"></circle></svg>\n      <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Recognition, never advantage. No search preference, no ranking, no edge for your players over any other club&rsquo;s. That rule matters more to us than the badge does.</div>\n    </div>\n\n    <div style=\"height: 1px; background: #24322a; position: relative;\"></div>\n\n    <div style=\"display: flex; flex-direction: column; gap: 8px; position: relative;\">\n      <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Who reads a child&rsquo;s record</div>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.6;\">You, and the verified coaches on that player&rsquo;s squad. <span style=\"color: #7d8f85;\">Not your administrators, not an unverified coach, not a rival club, and not us.</span></div>\n    </div>\n\n    <div style=\"display: flex; flex-direction: column; gap: 8px; position: relative;\">\n      <div style=\"display: flex; align-items: center; justify-content: center; background: #eda100; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Register interest in the Founding XI</div>\n      <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; text-align: center; line-height: 1.5;\">The programme opens after launch. Registering now puts your club in front of us first.</div>\n    </div>\n  </div>\n\n  <div style=\"height: 1px; background: #24322a;\"></div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3ddc84;\">What it costs</div>\n\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 12px;\">\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 10px;\">\n        <div style=\"font-size: 16px; font-weight: 900; color: #eef5f0;\">Free, and it stays free</div>\n        <div style=\"font-size: 24px; font-weight: 900; color: #eef5f0; line-height: 1;\">$0</div>\n      </div>\n      <div style=\"font-size: 13px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">Your club page, your squads, trial notices on the board, and players sending you their CV by email. No card, no trial period.</div>\n    </div>\n\n    <div style=\"position: relative; overflow: hidden; background: linear-gradient(160deg, #123326 0%, #0c1d14 70%, #0a1510 100%); border: 1.5px solid #3ddc84; border-radius: 20px; padding: 20px 18px; display: flex; flex-direction: column; gap: 15px;\">\n      <div style=\"position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #eda100;\"></div>\n      <div style=\"display: flex; flex-direction: column; gap: 6px; position: relative;\">\n        <div style=\"font-size: 21px; font-weight: 900; color: #eef5f0; line-height: 1.15; letter-spacing: -0.015em;\">The Interest Register</div>\n        <div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 500; line-height: 1.6;\">Every player who wants to be at your club, in one list, all year &mdash; not forty emails and a form you built yourself in the fortnight before a trial.</div>\n      </div>\n      <div style=\"display: flex; flex-direction: column; gap: 9px; position: relative;\">\n        <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n          <div style=\"font-size: 13px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Players register their interest inside Pitch. Nothing for you to build.</div>\n        </div>\n        <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n          <div style=\"font-size: 13px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Filter by position, age and squad. The gap in your squad, in one tap.</div>\n        </div>\n        <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n          <div style=\"font-size: 13px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">The players you can&rsquo;t take this year are still there next year.</div>\n        </div>\n      </div>\n      <div style=\"display: flex; gap: 10px; position: relative;\">\n        <div style=\"flex: 1; background: #0b120e; border: 1.5px solid #3ddc84; border-radius: 15px; padding: 14px 13px; display: flex; flex-direction: column; gap: 5px;\">\n          <div style=\"font-size: 22px; font-weight: 900; color: #eef5f0; line-height: 1;\">$329</div>\n          <div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 700;\">for 12 months, inc GST</div>\n          <div style=\"background: #eda100; color: #06130c; border-radius: 7px; padding: 4px 8px; font-size: 10.5px; font-weight: 900; align-self: flex-start; margin-top: 2px;\">Save $289</div>\n        </div>\n        <div style=\"flex: 1; background: #0b120e; border: 1px solid #24322a; border-radius: 15px; padding: 14px 13px; display: flex; flex-direction: column; gap: 5px;\">\n          <div style=\"font-size: 22px; font-weight: 900; color: #eef5f0; line-height: 1;\">$54</div>\n          <div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 700;\">a month, inc GST</div>\n          <div style=\"font-size: 10.5px; color: #7d8f85; font-weight: 700; margin-top: 2px;\">Cancel any time</div>\n        </div>\n      </div>\n      <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.55; position: relative;\">Paid by card, and your register opens the same minute. Paying buys you organisation, never access &mdash; the parent approval and the switch-off-able link are the same on both tiers.</div>\n    </div>\n  </div>\n\n  <div style=\"height: 1px; background: #24322a;\"></div>\n\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 13px;\">\n    <div style=\"display: inline-flex; align-items: center; gap: 7px; background: rgba(237, 161, 0, 0.14); border-radius: 999px; padding: 5px 11px; align-self: flex-start;\"><div style=\"width: 6px; height: 6px; border-radius: 999px; background: #eda100;\"></div><div style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">Coming soon</div></div>\n    <div style=\"display: flex; flex-direction: column; gap: 10px;\"><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 500; line-height: 1.45;\">Never lose a player because nobody knew he was available</div></div><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 500; line-height: 1.45;\">Know what every squad is working on without asking four coaches</div></div><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 500; line-height: 1.45;\">Show a parent what their fees bought, in numbers</div></div><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 500; line-height: 1.45;\">Keep a player&rsquo;s whole history when he moves up an age group</div></div><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 500; line-height: 1.45;\">Recruit the coach you want, with a record you can actually read</div></div></div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 4px;\">\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Claim your club page</div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; text-align: center;\">Australia first</div>\n  </div>\n\n</div>", "title": "1 · Landing — club & TD (now carries a price)", "w": 390}, "SignUpClub": {"html": "<div style=\"width: 390px; min-height: 900px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px;\">\n    <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg>\n    <div style=\"font-weight: 800; font-size: 15px;\">Pitch</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 5px;\">\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; color: #eef5f0;\">What's your position?</div>\n    <div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 500;\">Clubs claim an existing page — we have most Melbourne clubs already listed.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"width: 40px; height: 40px; border-radius: 12px; background: #1a2420; display: flex; align-items: center; justify-content: center;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"6.5\" r=\"3\"></circle><path d=\"M12 10 V15 M12 15 L8 20 M12 15 L16.5 18.5 M6 12.5 L12 11 M18 11.5 L12 11\"></path></svg></div>\n      <div style=\"display: flex; flex-direction: column; gap: 1px;\"><div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">Player</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Build your football CV</div></div>\n    </div>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"width: 40px; height: 40px; border-radius: 12px; background: #1a2420; display: flex; align-items: center; justify-content: center;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"4\" width=\"12\" height=\"17\" rx=\"2\"></rect><path d=\"M9.5 4 V2.8 H14.5 V4 M9 9 H15 M9 12.5 H15 M9 16 H12.5\"></path></svg></div>\n      <div style=\"display: flex; flex-direction: column; gap: 1px;\"><div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">Coach</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Develop your squad</div></div>\n    </div>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"width: 40px; height: 40px; border-radius: 12px; background: #1a2420; display: flex; align-items: center; justify-content: center;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"7\" r=\"2.6\"></circle><circle cx=\"16.5\" cy=\"9\" r=\"2.1\"></circle><path d=\"M4.5 20 C4.5 15.5 6.5 13.5 9 13.5 C11.5 13.5 13.5 15.5 13.5 20 M14.5 20 C14.5 16.8 15.4 14.8 16.5 14.8 C18.4 14.8 19.8 16.5 19.8 20\"></path></svg></div>\n      <div style=\"display: flex; flex-direction: column; gap: 1px;\"><div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">Parent / Guardian</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Approve and see their record</div></div>\n    </div>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #121b16; border: 1.5px solid #3ddc84; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"width: 40px; height: 40px; border-radius: 12px; background: rgba(61, 220, 132, 0.14); display: flex; align-items: center; justify-content: center;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 21 V4 M6 4 H17 L15 7 L17 10 H6\"></path><path d=\"M3.5 21 H10\"></path></svg></div>\n      <div style=\"display: flex; flex-direction: column; gap: 1px;\"><div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">Club</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Your club's home ground</div></div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 8px; margin-top: 4px;\">\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 2px;\">\n      <div style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">Date of birth</div>\n      <div style=\"font-size: 15px; color: #6b7d73; font-weight: 500;\">DD / MM / YYYY</div>\n    </div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">We check you against the club&rsquo;s own public listing before the page becomes yours.</div>\n  </div>\n\n  <div style=\"display: flex; align-items: center; gap: 9px; margin-top: 2px;\">\n    <div style=\"width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid #3a4a42; flex-shrink: 0;\"></div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">I agree to the <span style=\"color: #3ddc84; font-weight: 700;\">Terms</span> and <span style=\"color: #3ddc84; font-weight: 700;\">Privacy Policy</span></div>\n  </div>\n\n  <div style=\"background: #3ddc84; color: #06130c; border-radius: 15px; padding: 15px; text-align: center; font-size: 15px; font-weight: 900; margin-top: 2px;\">Continue</div>\n\n</div>", "title": "2 · Sign up — Club door", "w": 390}, "ClaimClub": {"html": "<div style=\"width: 390px; min-height: 1420px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px;\">\n    <div style=\"width: 44px; height: 44px; margin: -11px; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5 L8 12 l7 7\"></path></svg></div>\n    <div style=\"display: flex; align-items: center; gap: 8px;\">\n      <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg>\n      <div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 7px;\">\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -0.015em; color: #eef5f0;\">Claim Riverside FC</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">This page already exists — we built it from your public notices. Claiming it means you control what's on it and you can post trials.</div>\n  </div>\n\n  <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; gap: 13px;\">\n    <div style=\"width: 52px; height: 52px; border-radius: 16px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 900; font-size: 17px; color: #b9c8bf;\">RF</div>\n    <div style=\"display: flex; flex-direction: column; gap: 3px; flex: 1;\">\n      <div style=\"font-size: 16px; font-weight: 800; color: #eef5f0;\">Riverside FC</div>\n      <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500;\">Melbourne VIC · 12 teams listed</div>\n    </div>\n    <div style=\"display: inline-flex; align-items: center; gap: 6px; background: rgba(237, 161, 0, 0.14); border-radius: 999px; padding: 5px 10px; flex-shrink: 0;\">\n      <div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100;\"></div>\n      <div style=\"font-size: 9.5px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">Unclaimed</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Who are you at the club</div>\n    <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n\n      <div style=\"background: #121b16; border: 1.5px solid #3ddc84; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 12px;\">\n        <div style=\"width: 20px; height: 20px; border-radius: 999px; border: 2px solid #3ddc84; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;\"><div style=\"width: 10px; height: 10px; border-radius: 999px; background: #3ddc84;\"></div></div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">Technical Director</div>\n          <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Runs the football side. From December, the only role that reads a player's development record.</div>\n        </div>\n      </div>\n\n      <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 12px;\">\n        <div style=\"width: 20px; height: 20px; border-radius: 999px; border: 2px solid #3a4a42; flex-shrink: 0; margin-top: 1px;\"></div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">Club administrator</div>\n          <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Runs the page, the teams and the trial notices. <b style=\"color: #b9c8bf;\">Never reads a player's development record, by any route.</b></div>\n        </div>\n      </div>\n\n      <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 12px;\">\n        <div style=\"width: 20px; height: 20px; border-radius: 999px; border: 2px solid #3a4a42; flex-shrink: 0; margin-top: 1px;\"></div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">Committee or president</div>\n          <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Same as an administrator. You can hand the football side to your TD once you're in.</div>\n        </div>\n      </div>\n\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Prove it's your club</div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 4px;\">\n      <div style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">Your club email address</div>\n      <div style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; color: #6b7d73; font-weight: 500;\">you@riversidefc.com.au</div>\n    </div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">We send a code to the address on your club's own public listing. If you don't have access to it, we'll call the club instead — tell us below and we'll sort it out.</div>\n  </div>\n\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 11px;\">\n    <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><path d=\"M12 3 l7.5 3 v6 c0 4.5 -3.2 7.8 -7.5 9 c-4.3 -1.2 -7.5 -4.5 -7.5 -9 V6 Z\"></path><path d=\"M8.8 12 l2.2 2.2 l4.2 -4.4\"></path></svg>\n    <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Claiming gets you the page and trial notices. <b style=\"color: #eef5f0;\">Verified status is separate</b> — a person here checks your club against Football Victoria's register, and it's what unlocks anything to do with players from December.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: auto;\">\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Send me the code</div>\n    <div style=\"display: flex; align-items: center; justify-content: center; color: #7d8f85; font-weight: 700; font-size: 13.5px; height: 44px;\">I can't get to that address</div>\n  </div>\n\n</div>", "title": "3 · NEW — claim your club page", "w": 390}, "ClubPlan": {"html": "<div style=\"width: 390px; min-height: 1720px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px;\">\n    <div style=\"width: 44px; height: 44px; margin: -11px; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5 L8 12 l7 7\"></path></svg></div>\n    <div style=\"display: flex; align-items: center; gap: 8px;\">\n      <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg>\n      <div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -0.015em; color: #eef5f0;\">Riverside FC is claimed</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Now pick how you want players to reach you. You can change this whenever you like.</div>\n  </div>\n\n  <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 14px;\">\n    <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 10px;\">\n      <div style=\"font-size: 17px; font-weight: 900; color: #eef5f0;\">Free</div>\n      <div style=\"font-size: 26px; font-weight: 900; color: #eef5f0; line-height: 1;\">$0</div>\n    </div>\n    <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n      <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n        <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Your club page — crest, squads, philosophy, pathway.</div>\n      </div>\n      <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n        <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Post trial notices on the board, positions and all.</div>\n      </div>\n      <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n        <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Players send you their CV by email, the way they do now.</div>\n      </div>\n    </div>\n    <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; border-radius: 13px; height: 46px; font-size: 14px; font-weight: 700;\">Stay on free</div>\n  </div>\n\n  <div style=\"position: relative; overflow: hidden; background: linear-gradient(160deg, #123326 0%, #0c1d14 70%, #0a1510 100%); border: 1.5px solid #3ddc84; border-radius: 20px; padding: 20px 18px; display: flex; flex-direction: column; gap: 15px;\">\n    <div style=\"position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #eda100;\"></div>\n    <div style=\"display: flex; flex-direction: column; gap: 6px; position: relative;\">\n      <div style=\"font-size: 10.5px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">Live now</div>\n      <div style=\"font-size: 21px; font-weight: 900; color: #eef5f0; line-height: 1.15; letter-spacing: -0.015em;\">The Interest Register</div>\n      <div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Every player who wants to be at your club, in one list, all year &mdash; not forty emails in the fortnight before a trial.</div>\n    </div>\n\n    <div style=\"display: flex; flex-direction: column; gap: 9px; position: relative;\">\n      <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n        <div style=\"font-size: 12.5px; color: #eef5f0; font-weight: 500; line-height: 1.5;\">Everything in free, plus:</div>\n      </div>\n      <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n        <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Players register interest inside Pitch. No form to build, no inbox to sort.</div>\n      </div>\n      <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n        <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Filter by position, age group and squad. Find your keeper in one tap.</div>\n      </div>\n      <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n        <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">The players you can't take this year are still there next year.</div>\n      </div>\n      <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n        <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Your own notes and shortlist. Export the lot to a spreadsheet.</div>\n      </div>\n    </div>\n\n    <div style=\"display: flex; flex-direction: column; gap: 8px; position: relative;\">\n      <div style=\"background: #0b120e; border: 1.5px solid #3ddc84; border-radius: 15px; padding: 14px 15px; display: flex; align-items: center; gap: 12px;\">\n        <div style=\"width: 20px; height: 20px; border-radius: 999px; border: 2px solid #3ddc84; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><div style=\"width: 10px; height: 10px; border-radius: 999px; background: #3ddc84;\"></div></div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px; flex: 1;\">\n          <div style=\"display: flex; align-items: baseline; gap: 7px;\">\n            <div style=\"font-size: 22px; font-weight: 900; color: #eef5f0; line-height: 1;\">$329</div>\n            <div style=\"font-size: 12px; font-weight: 700; color: #7d8f85;\">for 12 months, inc GST</div>\n          </div>\n          <div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 700;\">Works out at $24.92 a month</div>\n        </div>\n        <div style=\"background: #eda100; color: #06130c; border-radius: 8px; padding: 5px 9px; font-size: 11px; font-weight: 900; letter-spacing: 0.02em; flex-shrink: 0;\">Save $289</div>\n      </div>\n      <div style=\"background: #0b120e; border: 1px solid #24322a; border-radius: 15px; padding: 14px 15px; display: flex; align-items: center; gap: 12px;\">\n        <div style=\"width: 20px; height: 20px; border-radius: 999px; border: 2px solid #3a4a42; flex-shrink: 0;\"></div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px; flex: 1;\">\n          <div style=\"display: flex; align-items: baseline; gap: 7px;\">\n            <div style=\"font-size: 22px; font-weight: 900; color: #eef5f0; line-height: 1;\">$54</div>\n            <div style=\"font-size: 12px; font-weight: 700; color: #7d8f85;\">a month, inc GST</div>\n          </div>\n          <div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 700;\">Cancel any time, including after trials</div>\n        </div>\n      </div>\n    </div>\n\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px; position: relative;\">Start the Interest Register</div>\n  </div>\n\n  <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 11px;\">\n    <div style=\"width: 34px; height: 34px; border-radius: 11px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2.5\"></rect><path d=\"M3 10 h18\"></path></svg></div>\n    <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n      <div style=\"font-size: 13.5px; font-weight: 800; color: #eef5f0;\">Pay by card, start the same minute</div>\n      <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">Your register opens as soon as you pay. Cancel the monthly plan yourself, any time, from your own billing page &mdash; you don&rsquo;t have to email us.</div>\n    </div>\n  </div>\n\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 11px;\">\n    <div style=\"width: 34px; height: 34px; border-radius: 11px; background: rgba(61, 220, 132, 0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3 l7.5 3 v6 c0 4.5 -3.2 7.8 -7.5 9 c-4.3 -1.2 -7.5 -4.5 -7.5 -9 V6 Z\"></path><path d=\"M8.8 12 l2.2 2.2 l4.2 -4.4\"></path></svg></div>\n    <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n      <div style=\"font-size: 13.5px; font-weight: 800; color: #eef5f0;\">Paying buys you organisation, not access</div>\n      <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">Free or paid, every under-16 profile is approved by a parent and every link can be switched off. That is never behind a price.</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; align-items: center; gap: 9px; padding: 0 2px;\">\n    <div style=\"background: rgba(237, 161, 0, 0.14); color: #eda100; border-radius: 7px; padding: 4px 9px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0;\">Founding XI</div>\n    <div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 700; line-height: 1.5;\">First eleven clubs shape what we build. Ask us to put your club forward.</div>\n  </div>\n\n</div>", "title": "4 · NEW — free, or the Interest Register", "w": 390}, "ClubCV": {"html": "<div style=\"width: 390px; min-height: 1810px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px;\">\n    <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg>\n    <div style=\"font-weight: 800; font-size: 15px;\">Pitch</div>\n  </div>\n\n  <div style=\"position: relative; overflow: hidden; border-radius: 22px; background: linear-gradient(160deg, #123326 0%, #0c1d14 60%, #0a1510 100%); padding: 24px 20px 22px 20px; display: flex; flex-direction: column; gap: 14px;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: flex-start;\">\n      <div style=\"width: 66px; height: 66px; border-radius: 16px; background: rgba(255, 255, 255, 0.12); border: 1.5px solid rgba(255, 255, 255, 0.2); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 26px; color: #eef5f0;\">R</div>\n      <div style=\"font-size: 10px; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255, 255, 255, 0.65); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 999px; padding: 4px 11px;\">Club</div>\n    </div>\n    <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n      <div style=\"font-size: 28px; font-weight: 900; line-height: 1.05; color: #eef5f0;\">Riverside FC</div>\n      <div style=\"font-size: 13px; color: rgba(255, 255, 255, 0.78); font-weight: 500;\">Est. 1974 · Melbourne VIC</div>\n      <div style=\"font-size: 13px; color: rgba(255, 255, 255, 0.62); font-weight: 500;\">MiniRoos → Juniors → Seniors pathway</div>\n    </div>\n    <div style=\"display: flex;\">\n      <div style=\"display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.14); border-radius: 999px; padding: 5px 12px; font-size: 11px; font-weight: 800; color: #eef5f0;\">\n        <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 L20 6 V11 C20 16.5 16.6 20.6 12 22 C7.4 20.6 4 16.5 4 11 V6 Z\"></path><path d=\"M9 12 L11 14 L15 9.5\"></path></svg>\n        <span>Verified club</span>\n      </div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">Our philosophy</div>\n    <div style=\"font-size: 14px; line-height: 1.55; color: #b9c8bf; font-weight: 500;\">Every junior plays, every junior develops. Football that's brave on the ball, and a club where families stay for a decade — not a season.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">Teams &amp; age groups</div>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 7px;\">\n      <div style=\"border: 1px solid #24322a; background: #121b16; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 800; color: #eef5f0;\">MiniRoos U8–U11</div>\n      <div style=\"border: 1px solid #24322a; background: #121b16; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 800; color: #eef5f0;\">U12 Mixed</div>\n      <div style=\"border: 1px solid #24322a; background: #121b16; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 800; color: #eef5f0;\">U13 Boys</div>\n      <div style=\"border: 1px solid #24322a; background: #121b16; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 800; color: #eef5f0;\">U13 Girls</div>\n      <div style=\"border: 1px solid #24322a; background: #121b16; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 800; color: #eef5f0;\">U14 Boys</div>\n      <div style=\"border: 1px solid #24322a; background: #121b16; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 800; color: #eef5f0;\">U14 Girls</div>\n      <div style=\"border: 1px solid #24322a; background: #121b16; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 800; color: #eef5f0;\">U15 Boys</div>\n      <div style=\"border: 1px solid #24322a; background: #121b16; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 800; color: #eef5f0;\">U15 Girls</div>\n      <div style=\"border: 1px solid #24322a; background: #121b16; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 800; color: #eef5f0;\">U16 Boys</div>\n      <div style=\"border: 1px solid #24322a; background: #121b16; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 800; color: #eef5f0;\">U16 Girls</div>\n      <div sty v style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">Ground</div>\n      <div style=\"font-size: 14.5px; color: #eef5f0; font-weight: 700;\">Riverside Park, Pitch 2</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Positions you're short of</div>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n      <div style=\"background: #3ddc84; color: #06130c; border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 900;\">Goalkeeper</div>\n      <div style=\"background: #3ddc84; color: #06130c; border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 900;\">Centre back</div>\n      <div style=\"border: 1px solid #24322a; color: #7d8f85; border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 700;\">Striker</div>\n      <div style=\"border: 1px solid #24322a; color: #7d8f85; border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 700;\">+ 7 more</div>\n    </div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Leave it blank for an open trial. Naming positions is what gets the right players in front of you — a keeper scanning the board sees your notice first.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">How to register</div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 4px;\">\n      <div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Turn up 15 minutes early. Boots, shin pads, water. Registration at the clubhouse.</div>\n    </div>
