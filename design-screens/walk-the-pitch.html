" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"6.5\" r=\"3\"></circle><path d=\"M12 10 V15 M12 15 L8 20 M12 15 L16.5 18.5 M6 12.5 L12 11 M18 11.5 L12 11\"></path></svg></div><div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\"><div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">A player</div><div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.4;\">Your complete player passport</div></div><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M9 6 l6 6 l-6 6\"></path></svg></div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; gap: 13px;\"><div style=\"width: 42px; height: 42px; border-radius: 13px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#a479e2\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"7\" r=\"2.6\"></circle><circle cx=\"16.5\" cy=\"9\" r=\"2.1\"></circle><path d=\"M4.5 20 C4.5 15.5 6.5 13.5 9 13.5 C11.5 13.5 13.5 15.5 13.5 20 M14.5 20 C14.5 16.8 15.4 14.8 16.5 14.8 C18.4 14.8 19.8 16.5 19.8 20\"></path></svg></div><div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\"><div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">A parent</div><div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.4;\">Set up and control your child&rsquo;s profile</div></div><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M9 6 l6 6 l-6 6\"></path></svg></div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; gap: 13px;\"><div style=\"width: 42px; height: 42px; border-radius: 13px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3987e5\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"4\" width=\"12\" height=\"17\" rx=\"2\"></rect><path d=\"M9.5 4 V2.8 H14.5 V4 M9 9 H15 M9 12.5 H15 M9 16 H12.5\"></path></svg></div><div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\"><div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">A coach</div><div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.4;\">Six years of coaching on one page</div></div><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M9 6 l6 6 l-6 6\"></path></svg></div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; gap: 13px;\"><div style=\"width: 42px; height: 42px; border-radius: 13px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#eda100\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 21 V4 M6 4 H17 L15 7 L17 10 H6\"></path><path d=\"M3.5 21 H10\"></path></svg></div><div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\"><div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">A club</div><div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.4;\">Create your digital home ground</div></div><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M9 6 l6 6 l-6 6\"></path></svg></div>\n  </div>\n  <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; font-weight: 700; font-size: 14px; border-radius: 14px; height: 46px;\">Browse trials without an account</div>\n  <div style=\"height: 1px; background: #24322a;\"></div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Free for every player under 18, and for every parent.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Under 16, nothing exists until a parent approves it.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Australia first &mdash; accounts are Australian at launch.</div></ 1.5;\">\"Right-footed 10 who plays between the lines. Works between the lines. Still sharpening my weak foot and my pressing triggers.\"</div>\n        </div>\n\n        <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n          <div style=\"font-size: 9.5px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Two clips</div>\n          <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Season highlights 2026 · vs Northern Utd — full performance</div>\n        </div>\n\n        <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n          <div style=\"font-size: 9.5px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Achievements &amp; other football</div>\n          <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">U15 League runners up · Players' Player of the Year 2025 · Northcote High 1st XI · Melbourne Futsal U15</div>\n        </div>\n\n        <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; font-weight: 700; font-size: 13px; border-radius: 11px; height: 42px;\">Open the full page</div>\n\n      </div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3ddc84;\">If you approve</div>\n    <div style=\"display: flex; flex-direction: column; gap: 7px;\">\n      <div style=\"display: flex; align-items: flex-start; gap: 10px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n        <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\"><b style=\"color: #eef5f0;\">Deniz will not appear in any search.</b> Under-16 profiles are not searchable on Pitch at all.</div>\n      </div>\n      <div style=\"display: flex; align-items: flex-start; gap: 10px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n        <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\"><b style=\"color: #eef5f0;\">No one can contact Deniz directly.</b> Every approach comes to you and Deniz together.</div>\n      </div>\n      <div style=\"display: flex; align-items: flex-start; gap: 10px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n        <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\"><b style=\"color: #eef5f0;\">You hold the share link.</b> It works only where you send it, expires every 90 days, and you can pause or regenerate it any time.</div>\n      </div>\n      <div style=\"display: flex; align-items: flex-start; gap: 10px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n        <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\"><b style=\"color: #eef5f0;\">You see everything he sees.</b> Linked account, full visibility — and you can withdraw all of it at any time.</div>\n      </div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: auto;\">\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Approve this page</div>\n    <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; font-weight: 700; font-size: 14px; border-radius: 13px; height: 48px;\">Not yet — I want to talk to him first</div>\n    <div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 500; text-align: center; line-height: 1.5;\">Approving accepts the Terms &amp; Privacy Policy on Deniz's behalf, and you can undo it any time.<br>If you do nothing, all of this is deleted after 14 days.</div>\n  </div>\n</div></div>\n</div>"}, "DeskLandingClub": {"title": "4 · Club landing page", "w": 1440, "html": "<div style=\"width: 1440px; min-height: 2500px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; box-sizing: border-box; display: flex; flex-direction: column;\">\n<div style=\"height: 4px; background: #eda100; flex-shrink: 0;\"></div>\n<div style=\"height: 62px; flex-shrink: 0; border-bottom: 1px solid #24322a; background: #121b16; display: flex; align-items: center; justify-content: space-between; padding: 0 28px;\"><div style=\"display: flex; align-items: center; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div><div style=\"font-size: 13px; font-weight: 700; color: #b9c8bf;\">Sign in</div></div><div style=\"flex: 1; display: flex; justify-content: center;\"><div style=\"width: 640px; display: flex; flex-direction: column; gap: 22px; padding: 34px 24px 70px 24px; box-sizing: border-box;\">\n<div style=\"position: relative; overflow: hidden; border-radius: 22px; background: linear-gradient(160deg, #123326 0%, #0c1d14 60%, #0a1510 100%); padding: 26px 20px 24px 20px; display: flex; flex-direction: column; gap: 14px;\">\n    <div style=\"position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #eda100;\"></div>\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">For clubs &amp; technical directors</div>\n    <div style=\"font-size: 32px; font-weight: 900; line-height: 1.05; letter-spacing: -0.015em; color: #eef5f0;\">Put your trials<br>where families<br>can find them.</div>\n    <div style=\"font-size: 14.5px; color: #b9c8bf; font-weight: 500; line-height: 1.6;\">Claim your club’s page, put your trial dates on it, and give families one place to check that isn’t a Facebook post they had to be following you to see.</div>\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px; margin-top: 4px;\">Claim your club page</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3ddc84;\">What a claimed page carries</div>\n    <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n      <div style=\"display: flex; align-items: flex-start; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n        <div style=\"width: 34px; height: 34px; border-radius: 11px; background: rgba(237, 161, 0, 0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#eda100\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15.5\" rx=\"2.5\"></rect><path d=\"M3.5 9.5 h17\"></path><path d=\"M8 3.5 v3 M16 3.5 v3\"></path></svg></div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Trial notices</div>\n          <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Age group, date, ground, and the positions you're actually short of. Listings expire on their own, so nobody turns up to a trial that happened last month.</div>\n        </div>\n      </div>\n      <div style=\"display: flex; align-items: flex-start; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n        <div style=\"width: 34px; height: 34px; border-radius: 11px; background: rgba(237, 161, 0, 0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#eda100\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"8\" cy=\"8\" r=\"2.6\"></circle><circle cx=\"16\" cy=\"8\" r=\"2.6\"></circle><path d=\"M3 19 c0 -3.4 2 -5.6 5 -5.6 s5 2.2 5 5.6\"></path><path d=\"M12.5 19 c0 -3.4 1.6 -5.6 3.5 -5.6 s5 2.2 5 5.6\"></path></svg></div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Every squad you run</div>\n          <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">MiniRoos through to seniors, each team a row of its own. Add one, retire one, in a tap.</div>\n        </div>\n      </div>\n      <div style=\"display: flex; align-items: flex-start; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n        <div style=\"width: 34px; height: 34px; border-radius: 11px; background: rgba(237, 161, 0, 0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#eda100\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20 V13 M4 13 l7 -4 l4 2.2 l5 -2.8\"></path><path d=\"M4 13 V6.5 l7 -3.5 l4 2.2 l5 -2.7 V9\"></path></svg></div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Who you've produced</div>\n          <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">The pathway wall — where your juniors went on to.</div>\n        </div>\n      </div>\n    </div>\n  </div>\n\n  <div style=\"position: relative; overflow: hidden; border-radius: 20px; background: linear-gradient(160deg, #123326 0%, #0c1d14 70%, #0a1510 100%); border: 1px solid #24322a; padding: 20px 18px; display: flex; flex-direction: column; gap: 15px;\">\n    <div style=\"position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #eda100;\"></div>\n    <div style=\"display: flex; flex-direction: column; gap: 7px; position: relative;\">\n      <div style=\"display: inline-flex; align-items: center; gap: 7px; background: rgba(237, 161, 0, 0.14); border-radius: 999px; padding: 5px 11px; align-self: flex-start;\"><div style=\"width: 6px; height: 6px; border-radius: 999px; background: #eda100;\"></div><div style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">Founding XI</div></div>\n      <div style=\"font-size: 21px; font-weight: 900; color: #eef5f0; line-height: 1.15; letter-spacing: -0.015em;\">Be one of the first eleven clubs</div>\n      <div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 500; line-height: 1.6;\">Eleven clubs shape what Pitch becomes. You sit in the room on the roadmap &mdash; what gets built next, and what gets built at all &mdash; because a technical director knows what this game needs better than we do. A pillar under a product built to make football better for everyone in it: the player, the parent, the coach and the club.</div>\n    </div>\n\n    <div style=\"display: flex; align-items: flex-start; gap: 10px; background: #1a2420; border-radius: 12px; padding: 12px 14px; position: relative;\">\n      <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 8 v5\"></path><circle cx=\"12\" cy=\"16\" r=\"0.6\" fill=\"#7d8f85\"></circle></svg>\n      <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Recognition, never advantage. No search preference, no ranking, no edge for your players over any other club&rsquo;s. That rule matters more to us than the badge does.</div>\n    </div>\n\n    <div style=\"height: 1px; background: #24322a; position: relative;\"></div>\n\n    <div style=\"display: flex; flex-direction: column; gap: 8px; position: relative;\">\n      <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Who reads a child&rsquo;s record</div>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.6;\">You, and the verified coaches on that player&rsquo;s squad. <span style=\"color: #7d8f85;\">Not your administrators, not an unverified coach, not a rival club, and not us.</span></div>\n    </div>\n\n    <div style=\"display: flex; flex-direction: column; gap: 8px; position: relative;\">\n      <div style=\"display: flex; align-items: center; justify-content: center; background: #eda100; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Register interest in the Founding XI</div>\n      <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; text-align: center; line-height: 1.5;\">The programme opens after launch. Registering now puts your club in front of us first.</div>\n    </div>\n  </div>\n\n  <div style=\"height: 1px; background: #24322a;\"></div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3ddc84;\">What it costs</div>\n\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 12px;\">\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 10px;\">\n        <div style=\"font-size: 16px; font-weight: 900; color: #eef5f0;\">Free, and it stays free</div>\n        <div style=\"font-size: 24px; font-weight: 900; color: #eef5f0; line-height: 1;\">$0</div>\n      </div>\n      <div style=\"font-size: 13px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">Your club page, your squads, trial notices on the board, and players sending you their CV by email. No card, no trial period.</div>\n    </div>\n\n    <div style=\"position: relative; overflow: hidden; background: linear-gradient(160deg, #123326 0%, #0c1d14 70%, #0a1510 100%); border: 1.5px solid #3ddc84; border-radius: 20px; padding: 20px 18px; display: flex; flex-direction: column; gap: 15px;\">\n      <div style=\"position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #eda100;\"></div>\n      <div style=\"display: flex; flex-direction: column; gap: 6px; position: relative;\">\n        <div style=\"font-size: 21px; font-weight: 900; color: #eef5f0; line-height: 1.15; letter-spacing: -0.015em;\">The Interest Register</div>\n        <div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 500; line-height: 1.6;\">Every player who wants to be at your club, in one list, all year &mdash; not forty emails and a form you built yourself in the fortnight before a trial.</div>\n      </div>\n      <div style=\"display: flex; flex-direction: column; gap: 9px; position: relative;\">\n        <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n          <div style=\"font-size: 13px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Players register their interest inside Pitch. Nothing for you to build.</div>\n        </div>\n        <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n          <div style=\"font-size: 13px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Filter by position, age and squad. The gap in your squad, in one tap.</div>\n        </div>\n        <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n          <div style=\"font-size: 13px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">The players you can&rsquo;t take this year are still there next year.</div>\n        </div>\n      </div>\n      <div style=\"display: flex; gap: 10px; position: relative;\">\n        <div style=\"flex: 1; background: #0b120e; border: 1.5px solid #3ddc84; border-radius: 15px; padding: 14px 13px; display: flex; flex-direction: column; gap: 5px;\">\n          <div style=\"font-size: 22px; font-weight: 900; color: #eef5f0; line-height: 1;\">$329</div>\n          <div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 700;\">for 12 months, inc GST</div>\n          <div style=\"background: #eda100; color: #06130c; border-radius: 7px; padding: 4px 8px; font-size: 10.5px; font-weight: 900; align-self: flex-start; margin-top: 2px;\">Save $289</div>\n        </div>\n        <div style=\"flex: 1; background: #0b120e; border: 1px solid #24322a; border-radius: 15px; padding: 14px 13px; display: flex; flex-direction: column; gap: 5px;\">\n          <div style=\"font-size: 22px; font-weight: 900; color: #eef5f0; line-height: 1;\">$54</div>\n          <div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 700;\">a month, inc GST</div>\n          <div style=\"font-size: 10.5px; color: #7d8f85; font-weight: 700; margin-top: 2px;\">Cancel any time</div>\n        </div>\n      </div>\n      <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.55; position: relative;\">Paid by card, and your register opens the same minute. Paying buys you organisation, never access &mdash; the parent approval and the switch-off-able link are the same on both tiers.</div>\n    </div>\n  </div>\n\n  <div style=\"height: 1px; background: #24322a;\"></div>\n\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 13px;\">\n    <div style=\"display: inline-flex; align-items: center; gap: 7px; background: rgba(237, 161, 0, 0.14); border-radius: 999px; padding: 5px 11px; align-self: flex-start;\"><div style=\"width: 6px; height: 6px; border-radius: 999px; background: #eda100;\"></div><div style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">Coming soon</div></div>\n    <div style=\"display: flex; flex-direction: column; gap: 10px;\"><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 500; line-height: 1.45;\">Never lose a player because nobody knew he was available</div></div><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 500; line-height: 1.45;\">Know what every squad is working on without asking four coaches</div></div><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 500; line-height: 1.45;\">Show a parent what their fees bought, in numbers</div></div><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 500; line-height: 1.45;\">Keep a player&rsquo;s whole history when he moves up an age group</div></div><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 500; line-height: 1.45;\">Recruit the coach you want, with a record you can actually read</div></div></div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 4px;\">\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Claim your club page</div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; text-align: center;\">Australia first</div>\n  </div>\n</div></div>\n</div>"}, "DeskClubCV": {"title": "5 · Club page", "w": 1440, "html": "<div style=\"width: 1440px; min-height: 1930px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; box-sizing: border-box; display: flex; flex-direction: column;\">\n<div style=\"height: 4px; background: #eda100; flex-shrink: 0;\"></div>\n<div style=\"height: 62px; flex-shrink: 0; border-bottom: 1px solid #24322a; background: #121b16; display: flex; align-items: center; justify-content: space-between; padding: 0 28px;\"><div style=\"display: flex; align-items: center; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div><div style=\"font-size: 13px; font-weight: 700; color: #b9c8bf;\">Riverside FC</div></div><div style=\"flex: 1; display: flex; justify-content: center;\"><div style=\"width: 640px; display: flex; flex-direction: column; gap: 22px; padding: 34px 24px 70px 24px; box-sizing: border-box;\">\n<div style=\"position: relative; overflow: hidden; border-radius: 22px; background: linear-gradient(160deg, #123326 0%, #0c1d14 60%, #0a1510 100%); padding: 24px 20px 22px 20px; display: flex; flex-direction: column; gap: 14px;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: flex-start;\">\n      <div style=\"width: 66px; height: 66px; border-radius: 16px; background: rgba(255, 255, 255, 0.12); border: 1.5px solid rgba(255, 255, 255, 0.2); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 26px; color: #eef5f0;\">R</div>\n      <div style=\"font-size: 10px; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255, 255, 255, 0.65); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 999px; padding: 4px 11px;\">Club</div>\n    </div>\n    <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n      <div style=\"font-size: 28px; font-weight: 900; line-height: 1.05; color: #eef5f0;\">Riverside FC</div>\n      <div style=\"font-size: 13px; color: rgba(255, 255, 255, 0.78); font-weight: 500;\">Est. 1974 · Melbourne VIC</div>\n      <div style=\"font-size: 13px; color: rgba(255, 255, 255, 0.62); font-weight: 500;\">MiniRoos → Juniors → Seniors pathway</div>\n    </div>\n    <div style=\"display: flex;\">\n      <div style=\"display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.14); border-radius: 999px; padding: 5px 12px; font-size: 11px; font-weight: 800; color: #eef5f0;\">\n        <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 L20 6 V11 C20 16.5 16.6 20.6 12 22 C7.4 20.6 4 16.5 4 11 V6 Z\"></path><path d=\"M9 12 L11 14 L15 9.5\"></path></svg>\n        <span>Verified club</span>\n      </div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">Our philosophy</div>\n    <div style=\"font-size: 14px; line-height: 1.55; color: #b9c8bf; font-weight: 500;\">Every junior plays, every junior develops. Football that's brave on the ball, and a club where families stay for a decade — not a season.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">Teams &amp; age groups</div>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 7px;\">\n      <div style=\"border: 1px solid #24322a; background: #121b16; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 800; color: #eef5f0;\">MiniRoos U8–U11</div>\n      <div style=\"border: 1px solid #24322a; background: #121b16; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 800; color: #eef5f0;\">U12 Mixed</div>\n      <div style=\"border: 1px solid #24322a; background: #121b16; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 800; color: #eef5f0;\">U13 Boys</div>\n      <div style=\"border: 1px solid #24322a; background: #121b16; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 800; color: #eef5f0;\">U13 Girls</div>\n      <div style=\"border: 1px solid #24322a; background: #121b16; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 800; color: #eef5f0;\">U14 Boys</div>\n      <div style=\"border: 1px solid #24322a; background: #121b16; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 800; color: #eef5f0;\">U14 Girls</div>\n      <div style=\"border: 1px solid #24322a; background: #121b16; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 800; color: #e un 9:00 AM · Riverside Park, Pitch 2</div></div>\n      </div>\n      <div style=\"display: flex; align-items: center; gap: 12px;\">\n        <div style=\"display: flex; flex-direction: column; align-items: center; background: rgba(61, 220, 132, 0.12); border-radius: 11px; padding: 7px 11px; flex-shrink: 0;\"><div style=\"font-size: 9px; font-weight: 900; letter-spacing: 0.06em; color: #3ddc84;\">OCT</div><div style=\"font-size: 18px; font-weight: 900; color: #eef5f0; line-height: 1;\">18</div></div>\n        <div style=\"display: flex; flex-direction: column; gap: 1px;\"><div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Girls U13–U16 trials</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Sun 10:00 AM · Riverside Park, Pitch 1</div></div>\n      </div>\n      <div style=\"border-top: 1px solid #24322a; padding-top: 11px; font-size: 12px; color: #7d8f85; font-weight: 500;\">How to register: via the club — details in each notice. Send them your Pitch CV link when you register.</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">Players wanted</div>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 1px; flex-grow: 1;\"><div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">U13 Boys — Goalkeeper</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Train Tue &amp; Thu · immediate start</div></div>\n      <div style=\"font-size: 11px; font-weight: 800; color: #3ddc84; white-space: nowrap;\">Get in touch</div>\n    </div>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 1px; flex-grow: 1;\"><div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">U16 Girls — 2 outfield spots</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Season 2027 squad</div></div>\n      <div style=\"font-size: 11px; font-weight: 800; color: #3ddc84; white-space: nowrap;\">Get in touch</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">The pathway is real</div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 5px 15px; display: flex; flex-direction: column;\">\n      <div style=\"display: flex; align-items: center; gap: 11px; padding: 11px 0; border-bottom: 1px solid #24322a;\">\n        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M4 19 L9 13 L13 16 L20 7\"></path><path d=\"M15 7 H20 V12\"></path></svg>\n        <div style=\"display: flex; flex-direction: column; gap: 0;\"><div style=\"font-size: 13.5px; font-weight: 800; color: #eef5f0;\">Marco V. → NPL Victoria</div><div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 500;\">Riverside juniors 2012–2018</div></div>\n      </div>\n      <div style=\"display: flex; align-items: center; gap: 11px; padding: 11px 0; border-bottom: 1px solid #24322a;\">\n        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M4 19 L9 13 L13 16 L20 7\"></path><path d=\"M15 7 H20 V12\"></path></svg>\n        <div style=\"display: flex; flex-direction: column; gap: 0;\"><div style=\"font-size: 13.5px; font-weight: 800; color: #eef5f0;\">Aylin D. → State representative squad</div><div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 500;\">Riverside juniors 2011–2017</div></div>\n      </div>\n      <div style=\"display: flex; align-items: center; gap: 11px; padding: 11px 0;\">\n        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M4 19 L9 13 L13 16 L20 7\"></path><path d=\"M15 7 H20 V12\"></path></svg>\n        <div style=\"display: flex; flex-direction: column; gap: 0;\"><div style=\"font-size: 13.5px; font-weight: 800; color: #eef5f0;\">A 2019 U13 → our senior first team</div><div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 500;\">Straight through the pathway, still playing</div></div>\n      </div>\n      <div style=\"font-size: 10.5px; color: #6b7d73; font-weight: 700; padding-top: 4px;\">Named players are 18+ and have given permission. Younger pathway stories stay unnamed.</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n    <div style=\"background: #121b16; border: 1.5px solid #3ddc84; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 3px;\">\n      <div style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">Club page link</div>\n      <div style=\"font-size: 14px; font-weight: 800; color: #3ddc84;\">pitchfootball.com.au/riverside-fc</div>\n    </div>\n    <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;\">\n      <div style=\"background: #3ddc84; color: #06130c; border-radius: 15px; padding: 14px; text-align: center; font-size: 14px; font-weight: 900;\">Enquire</div>\n      <div style=\"border: 1px solid #24322a; color: #eef5f0; border-radius: 15px; padding: 14px; text-align: center; font-size: 14px; font-weight: 800;\">Share page</div>\n called<span style=\"color: #e34948;\"> *</span></div><div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 12px; height: 44px; display: flex; align-items: center; padding: 0 13px; font-family: ui-monospace, Menlo, monospace; font-size: 13.5px; font-weight: 700; color: #eef5f0;\">(03) 9744 ••••</div></div><div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Where you found it<span style=\"color: #e34948;\"> *</span></div><div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 12px; height: 44px; display: flex; align-items: center; padding: 0 13px; font-size: 13.5px; font-weight: 700; color: #eef5f0;\">Sunbury United website /contact</div></div></div><div style=\"font-size: 11.5px; font-weight: 700; color: #7d8f85; line-height: 1.55;\"><b>number_source is mandatory.</b> A blank here invalidates the call and the flag cannot be set.</div></div><div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 11px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">The four questions</div><div style=\"display: flex; gap: 12px;\"><div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Is this the club?</div><div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 12px; height: 44px; display: flex; align-items: center; padding: 0 13px; font-size: 13.5px; font-weight: 700; color: #eef5f0;\">Yes — confirmed league and ground</div></div><div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Who claimed it?</div><div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 12px; height: 44px; display: flex; align-items: center; padding: 0 13px; font-size: 13.5px; font-weight: 700; color: #eef5f0;\">They named “Michael Harris” unprompted</div></div></div><div style=\"display: flex; gap: 12px;\"><div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Incorporated?</div><div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 12px; height: 44px; display: flex; align-items: center; padding: 0 13px; font-size: 13.5px; font-weight: 700; color: #eef5f0;\">Yes — incorporated association</div></div><div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Authorised to subscribe?</div><div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 12px; height: 44px; display: flex; align-items: center; padding: 0 13px; font-size: 13.5px; font-weight: 700; color: #eef5f0;\">Yes — treasurer confirms</div></div></div><div style=\"font-size: 12.5px; font-weight: 700; color: #b9c8bf; line-height: 1.55;\">Ask <i>“who would that be?”</i> — never <i>“is it Michael Harris?”</i>. Offering the name leaves them nothing to do but agree.</div></div><div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 11px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Notes</div><div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 12px; padding: 12px 13px; font-size: 13px; font-weight: 500; color: #b9c8bf; line-height: 1.6; min-height: 62px;\">Spoke to the secretary. Knew about the Pitch page, said Michael had mentioned it. No hesitation.</div><div style=\"font-size: 11.5px; font-weight: 700; color: #7d8f85; line-height: 1.55;\">Anything that felt off belongs here even if you verified anyway.</div></div><div style=\"display: flex; gap: 12px;\"><div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; height: 50px; border-radius: 14px; padding: 0 20px; font-size: 15px; font-weight: 800;\">Verify Sunbury United</div><div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; height: 50px; border-radius: 14px; padding: 0 20px; font-size: 15px; font-weight: 800;\">Not verified — log and leave held</div></div><div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 11px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3987e5;\">What this writes</div><div style=\"font-size: 12.5px; font-weight: 700; color: #b9c8bf; line-height: 1.55;\">One audit row: <b>BUZ</b> · 1 Sep 10:34 · Sunbury United · number called and its source · the four answers · outcome. <b>No webhook, payment, claim or migration can write this flag</b> — doc 14 §M4 asserts that no such path exists.</div></div></div></div></div>\n</div>"}, "OpsReports": {"title": "5 · Report — reporter-scoped", "w": 1440, "html": "<div style=\"width: 1440px; min-height: 1000px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; box-sizing: border-box; padding: 0; display: flex; flex-direction: column;\">\n\n<div style=\"flex: 1; display: flex; min-height: 100%;\"><div style=\"width: 236px; flex-shrink: 0; background: #121b16; border-right: 1px solid #24322a; display: flex; flex-direction: column;\"><div style=\"padding: 18px 16px 16px 16px; border-bottom: 1px solid #24322a; display: flex; align-items: center; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div><div style=\"padding: 16px 14px 12px 14px; border-bottom: 1px solid #24322a;\"><div style=\"font-size: 14px; font-weight: 800; color: #eef5f0; line-height: 1.25;\">Pitch operations</div><div style=\"font-size: 11.5px; font-weight: 700; color: #7d8f85; margin-top: 3px;\">BUZ · sys_admin</div></div><div style=\"padding: 12px 10px; display: flex; flex-direction: column; gap: 3px;\"><div style=\"display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 10px; font-size: 13px; font-weight: 700; color: #b9c8bf;\"><div style=\"width: 6px; height: 6px; border-radius: 999px; background: transparent;\"></div>Today</div><div style=\"display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 10px; font-size: 13px; font-weight: 700; color: #b9c8bf;\"><div style=\"width: 6px; height: 6px; border-radius: 999px; background: transparent;\"></div>Lookup</div><div style=\"display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 10px; font-size: 13px; font-weight: 700; color: #b9c8bf;\"><div style=\"width: 6px; height: 6px; border-radius: 999px; background: transparent;\"></div>Verification<div style=\"margin-left: auto; font-size: 11px; font-weight: 700; color: #7d8f85;\">3</div></div><div style=\"background: #1a2420; display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 10px; font-size: 13px; font-weight: 700; color: #eef5f0;\"><div style=\"width: 6px; height: 6px; border-radius: 999px; background: #3987e5;\"></div>Reports<div style=\"margin-left: auto; font-size: 11px; font-weight: 700; color: #7d8f85;\">1</div></div><div style=\"display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 10px; font-size: 13px; font-weight: 700; color: #b9c8bf;\"><div style=\"width: 6px; height: 6px; border-radius: 999px; background: transparent;\"></div>Money</div></div></div><div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column;\"><div style=\"height: 70px; flex-shrink: 0; border-bottom: 1px solid #24322a; background: #121b16; display: flex; align-items: center; padding: 0 26px;\"><div><div style=\"font-size: 17px; font-weight: 800; letter-spacing: -0.015em;\">Report R-0042</div><div style=\"font-size: 12px; font-weight: 500; color: #7d8f85; margin-top: 2px;\">Doc 25 · reporter-scoped view</div></div><div style=\"margin-left: auto; display: flex; gap: 9px;\"><div style=\"display: flex; align-items: center; justify-content: center; background: #1a2420; color: #b9c8bf; height: 40px; border-radius: 12px; padding: 0 16px; font-size: 13px; font-weight: 700;\">Close the report</div></div></div><div style=\"flex: 1; padding: 24px 26px 40px 26px; display: flex; flex-direction: column; gap: 18px; max-width: 1200px;\"><div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 11px;\"><div style=\"display: flex; gap: 14px;\"><div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Report</div><div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 12px; height: 44px; display: flex; align-items: center; padding: 0 13px; font-size: 13.5px; font-weight: 700; color: #eef5f0;\">R-0042 · received 31 Aug 19:20</div></div><div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">From</div><div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 12px; height: 44px; display: flex; align-items: center; padding: 0 13px; font-size: 13.5px; font-weight: 700; color: #eef5f0;\">A parent at another club</div></div><div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">About</div><div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 12px; height: 44px; display: flex; align-items: center; padding: 0 13px; font-size: 13.5px; font-weight: 700; color: #eef5f0;\">A highlight clip</div></div><div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">State</div><div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 12px; height: 44px; display: flex; align-items: center; padding: 0 13px; font-size: 13.5px; font-weight: 700; color: #eef5f0;\">Open</div></div></div><div style=\"height: 1px; background: #24322a; margin: 3px 0;\"></div><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">What they wrote</div><div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 12px; padding: 13px; font-size: 13px; font-weight: 500; color: #b9c8bf; line-height: 1.6;\">“One of the videos on this page has other kids in it who aren’t on Pitch and I don’t think their parents know.”</div></div><div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 11px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3987e5;\">The one item named in this report</div><div style=\"display: flex; gap: 14px;\"><div style=\"width: 200px; height: 118px; border-radius: 12px; background: #1a2420; border: 1px solid #24322a; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"1.8\"><polygon points=\"9,7 18,12 9,17\"></polygon></svg></div><div style=\"flex: 1; display: flex; flex-direction: column; gap: 7px;\"><div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Clip 3 — “U15s v Northern, second half”</div><div style=\"font-size: 12px; font-weight: 700; color: #7d8f85; line-height: 1.55;\">Added 12 Aug · guardian-approved 12 Aug · third-party embed</div><div style=\"display: flex; gap: 9px; margin-top: 4px;\"><div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; height: 40px; border-radius: 12px; padding: 0 16px; font-size: 13px; font-weight: 800;\">Take the clip down</div><div style=\"display: flex; align-items: center; justify-content: center; background: #1a2420; color: #b9c8bf; height: 40px; border-radius: 12px; padding: 0 16px; font-size: 13px; font-weight: 700;\">No action — close</div></div></div></div></div><div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 11px;\"><div style=\"display: flex; align-items: center; gap: 9px; background: #1a2420; border: 1px dashed #24322a; border-radius: 12px; padding: 12px 13px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><rect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"10\" rx=\"2\"></rect><path d=\"M8 10.5 V7.5 a4 4 0 0 1 8 0 V10.5\"></path></svg><div style=\"font-size: 12.5px; font-weight: 700; color: #7d8f85;\">The rest of this record is not readable — and will not become readable</div></div><div style=\"font-size: 12.5px; font-weight: 700; color: #b9c8bf; line-height: 1.55;\">You can see the clip because the report names the clip. You cannot see the page it sits on, the child’s name, their club, their stats or anything else. <b>Acting on a report never opens the record</b> — otherwise any report, including a malicious one, becomes a key to a child’s file. (U-6, ruled 28 Aug)</div></div><div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 11px;\"><div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3987e5;\">This access is time-boxed</div><div style=\"font-size: 12.5px; font-weight: 700; color: #b9c8bf; line-height: 1.55;\">Granted to <b>BUZ</b> against report <b>R-0042</b> at 1 Sep 10:41. <b>It expires when the report closes</b> and it is logged as a disclosure, not as an action. Closing the report ends the access whether or not you took the clip down.</div></div></div></div></div>\n</div>"}}};
let pi = 0, si = 0;

const $ = id => document.getElementById(id);

function renderPersonas(){
  $('personas').innerHTML = DATA.personas.map((p,i)=>
    `<button class="pbtn" data-p="${i}" aria-current="${i===pi}">
       <span class="dot" style="background:${p.colour}"></span>${p.label}
       <span class="cnt">${p.screens.length}</span></button>`).join('');
  $('personas').querySelectorAll('.pbtn').forEach(b=>
    b.onclick = () => { pi = +b.dataset.p; si = 0; renderAll(); });
}

function renderSteps(){
  const p = DATA.personas[pi];
  $('steps').innerHTML = p.screens.map((k,i)=>{
    const t = DATA.screens[k].title.replace(/&/g,'&amp;').replace(/</g,'&lt;');
    return `<button class="sbtn" data-s="${i}" aria-current="${i===si}">
              <span class="i">${i+1}</span><span>${t}</span></button>`;
  }).join('');
  $('steps').querySelectorAll('.sbtn').forEach(b=>
    b.onclick = () => { si = +b.dataset.s; renderAll(); });
  const cur = $('steps').querySelector('[aria-current="true"]');
  if (cur) cur.scrollIntoView({block:'nearest'});
}

function renderStage(){
  const p = DATA.personas[pi];
  const key = p.screens[si];
  const sc = DATA.screens[key];
  $('stitle').textContent = sc.title;
  $('swho').textContent = p.who;
  $('pos').textContent = (si+1) + ' / ' + p.screens.length;
  $('prev').disabled = si === 0;
  $('next').disabled = si === p.screens.length - 1;
  const wide = sc.w > 400;
  $('stage').innerHTML = `<div class="phone${wide?' wide':''}"${wide?` style="width:${Math.min(sc.w,1180)}px"`:''}>${sc.html}</div>`;
  if (wide) {
    const inner = $('stage').querySelector('.phone > div');
    if (inner) { const s = Math.min(1180, sc.w) / sc.w;
      inner.style.transform = `scale(${s})`; inner.style.transformOrigin = 'top left';
      $('stage').querySelector('.phone').style.height = (inner.offsetHeight * s) + 'px';
      $('stage').querySelector('.phone').style.overflow = 'hidden'; }
  }
  $('stage').scrollTop = 0;
}

function renderAll(){ renderPersonas(); renderSteps(); renderStage(); }

document.addEventListener('keydown', e => {
  const p = DATA.personas[pi];
  if (e.key === 'ArrowRight' && si < p.screens.length-1) { si++; renderAll(); }
  else if (e.key === 'ArrowLeft' && si > 0) { si--; renderAll(); }
  else if (e.key >= '1' && e.key <= '9') { const n = +e.key - 1;
    if (n < DATA.personas.length) { pi = n; si = 0; renderAll(); } }
});
$('prev').onclick = () => { if (si>0){ si--; renderAll(); } };
$('next').onclick = () => { if (si < DATA.personas[pi].screens.length-1){ si++; renderAll(); } };

renderAll();
</script>
