gap: 19px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px;\">\n    <div style=\"width: 44px; height: 44px; margin: -11px; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5 L8 12 l7 7\"></path></svg></div>\n    <div style=\"display: flex; align-items: center; gap: 8px;\">\n      <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg>\n      <div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 7px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">On your register since 3 July</div>\n    <div style=\"font-size: 27px; font-weight: 900; line-height: 1.08; letter-spacing: -0.015em; color: #eef5f0;\">Josh Whelan</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 700;\">15 · Goalkeeper · Northern United SC</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">What he sent you</div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 13px;\">\n      <div style=\"display: flex; gap: 24px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 9.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">Squad</div>\n          <div style=\"font-size: 14.5px; color: #eef5f0; font-weight: 700;\">U16 Boys</div>\n        </div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 9.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85;\">Position</div>\n          <div style=\"font-size: 14.5px; color: #eef5f0; font-weight: 700;\">GK</div>\n        </div>\n      </div>\n      <div style=\"height: 1px; background: #24322a;\"></div>\n      <div style=\"font-size: 13.5px; color: #eef5f0; font-weight: 500; line-height: 1.55;\">&ldquo;Been on the bench behind a keeper two years older. Want game time.&rdquo;</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Open his CV</div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">A link to the live page. If he changes clubs in March, what you're reading changes with him — and if his family switches the link off, it stops opening.</div>\n  </div>\n\n  <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 11px;\">\n    <div style=\"font-size: 13.5px; font-weight: 800; color: #eef5f0;\">What you don't have, and won't</div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e34948\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M6 6 L18 18 M18 6 L6 18\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">His date of birth. You have an age, which is what you pick a squad on.</div>\n    </div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e34948\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M6 6 L18 18 M18 6 L6 18\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">A phone number, an email or an address, for him or his family.</div>\n    </div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e34948\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M6 6 L18 18 M18 6 L6 18\"></path></svg>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Any way to message him. There is one route to this family and it is the invitation below.</div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 8px;\">\n      <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Where you're up to</div>\n      <div style=\"font-size: 11px; font-weight: 700; color: #7d8f85;\">Only Riverside FC sees this</div>\n    </div>\n    <div style=\"display: flex; gap: 7px;\">\n      <div style=\"flex: 1; border: 1px solid #24322a; color: #7d8f85; border-radius: 12px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;\">New</div>\n      <div style=\"flex: 1; background: rgba(237, 161, 0, 0.16); border: 1.5px solid #eda100; color: #eda100; border-radius: 12px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900;\">Shortlisted</div>\n      <div style=\"flex: 1; border: 1px solid #24322a; color: #7d8f85; border-radius: 12px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;\">Invited</div>\n    </div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; min-height: 56px;\">\n      <div style=\"font-size: 13px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Watched him at Dunstan 9 Aug. Good with his feet, quiet in the box. Worth a look for the 16s.</div>\n    </div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Josh never sees this and neither does his family. There is no fourth state where we tell him no.</div>\n  </div>\n\n  <div style=\"background: linear-gradient(160deg, #123326 0%, #0c1d14 100%); border: 1px solid #24322a; border-radius: 18px; padding: 17px; display: flex; flex-direction: column; gap: 12px;\">\n    <div style=\"display: flex; align-items: flex-start; gap: 12px;\">\n      <div style=\"width: 36px; height: 36px; border-radius: 12px; background: rgba(164, 121, 226, 0.18); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#a479e2\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"7.5\" r=\"2.8\"></circle><circle cx=\"16.5\" cy=\"9.5\" r=\"2.2\"></circle><path d=\"M4 20 c0 -4.2 2.2 -6.5 5 -6.5 s5 2.3 5 6.5\"></path><path d=\"M15 20 c0 -3 0.9 -4.8 2 -4.8 c1.9 0 3 1.6 3 4.8\"></path></svg></div>\n      <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n        <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">An invitation goes to his parent</div>\n        <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">He's 15, so the invitation lands with the adult who put him on your register. They decide what he hears about it.</div>\n      </div>\n    </div>\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Invite him to a trial</div>\n  </div>\n\n  <div style=\"display: flex; align-items: flex-start; gap: 9px; padding: 0 2px;\">\n    <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6b7d73\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7.5 v5\"></path><circle cx=\"12\" cy=\"16.2\" r=\"0.6\" fill=\"#6b7d73\"></circle></svg>\n    <div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 700; line-height: 1.5;\">Do nothing and nothing happens. He isn't waiting on you, and he stays on the register for next season.</div>\n  </div>\n\n</div>", "title": "8 · NEW — one entry, opened", "w": 390}, "LinkState": {"html": "<div style=\"width: 390px; min-height: 1120px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div>\n  <div><div style=\"width: 56px; height: 56px; border-radius: 18px; background: #1a2420; display: flex; align-items: center; justify-content: center;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"10\" rx=\"2.5\"></rect><path d=\"M8 10.5 V7.5 a4 4 0 0 1 8 0 v3\"></path></svg></div></div>\n  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -0.015em; color: #eef5f0;\">This link doesn&rsquo;t open anything</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">It may have been switched off, it may have expired, or it may never have been a link at all. We don&rsquo;t say which.</div>\n  </div>\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 10px;\"><div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">That is deliberate. If we told you which, anyone could use a wrong link to find out whether a particular child is on Pitch. The answer is the same either way.</div></div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">If you are a club</div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 12px;\"><div style=\"width: 40px; height: 40px; border-radius: 12px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 900; font-size: 13px; color: #b9c8bf;\">RF</div><div style=\"display: flex; flex-direction: column; gap: 3px;\"><div style=\"font-size: 14.5px; font-weight: 800; color: #eef5f0;\">Signed in as Riverside FC</div><div style=\"display: flex; align-items: center; gap: 5px;\"><div style=\"width: 6px; height: 6px; border-radius: 999px; background: #3ddc84;\"></div><div style=\"font-size: 11px; font-weight: 800; color: #3ddc84;\">Verified club</div></div></div></div>\n      <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">You can ask the family for a new link. They will see it is Riverside FC asking &mdash; your club&rsquo;s verified name, not something you type.</div>\n    </div>\n  </div>\n  <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Ask the family for access</div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Your club&rsquo;s verified identity goes with the request. There is nothing here for you to fill in.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">It lands in the family&rsquo;s Pitch account. They may ignore it, and we will not chase them for you.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">One request per link, per day.</div></div>\n  </div>\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 10px;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7.5 v5\"></path><circle cx=\"12\" cy=\"16.2\" r=\"0.6\" fill=\"#7d8f85\"></circle></svg><div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">Not signed in as a verified club? Then there is nothing on this page for you, and there is nothing more we will tell you.</div></div>\n\n</div>", "title": "9 · A dead link — verified clubs may ask (D-116)", "w": 390}, "ClaimCode": {"html": "<div style=\"width: 390px; min-height: 1000px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px;\">\n    <div style=\"width: 44px; height: 44px; margin: -11px; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5 L8 12 l7 7\"></path></svg></div>\n    <div style=\"display: flex; align-items: center; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -0.015em; color: #eef5f0;\">Enter your code</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">We sent six digits to <b style=\"color: #eef5f0;\">football@riversidefc.com.au</b> &mdash; the address on Riverside FC&rsquo;s own public listing.</div>\n  </div>\n  <div style=\"display: flex; gap: 8px;\"><div style=\"flex: 1; height: 62px; background: #121b16; border: 1px solid #3ddc84; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; color: #eef5f0;\">4</div><div style=\"flex: 1; height: 62px; background: #121b16; border: 1px solid #3ddc84; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; color: #eef5f0;\">8</div><div style=\"flex: 1; height: 62px; background: #121b16; border: 1px solid #3ddc84; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; color: #eef5f0;\">2</div><div style=\"flex: 1; height: 62px; background: #121b16; border: 1px solid #3ddc84; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; color: #eef5f0;\">9</div><div style=\"flex: 1; height: 62px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; color: #6b7d73;\"></div><div style=\"flex: 1; height: 62px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; color: #6b7d73;\"></div></div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">We are not checking who you are. We are checking you can read the club&rsquo;s own inbox.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Claiming gets you the page and trial notices. It does not verify the club &mdash; a human does that against Football Victoria&rsquo;s register.</div></div>\n  </div>\n  <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Claim Riverside FC</div>\n  <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; font-weight: 700; font-size: 14px; border-radius: 14px; height: 46px;\">Send the code again</div>\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 10px;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7.5 v5\"></path><circle cx=\"12\" cy=\"16.2\" r=\"0.6\" fill=\"#7d8f85\"></circle></svg><div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">No code arriving? The listed address may be out of date. Tell us and we will call the club instead &mdash; it takes a day or two and we would rather be slow than wrong about who owns a club&rsquo;s page.</div></div>\n\n</div>", "title": "3b · NEW — enter the claim code", "w": 390}, "ClaimTaken": {"html": "<div style=\"width: 390px; min-height: 940px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px;\">\n    <div style=\"width: 44px; height: 44px; margin: -11px; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5 L8 12 l7 7\"></path></svg></div>\n    <div style=\"display: flex; align-items: center; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><r player. You can do the first without the second.</div>\n  </div>\n  <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Invite a coach</div>\n  <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; font-weight: 700; font-size: 14px; border-radius: 14px; height: 46px;\">Add an administrator</div>\n\n</div>", "title": "NEW — people at your club", "w": 390}, "AddCoach": {"html": "<div style=\"width: 390px; min-height: 1360px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px;\">\n    <div style=\"width: 44px; height: 44px; margin: -11px; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5 L8 12 l7 7\"></path></svg></div>\n    <div style=\"display: flex; align-items: center; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -0.015em; color: #eef5f0;\">Invite a coach</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Send them a link. They build their own CV &mdash; you never fill it in for them.</div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Their link</div>\n    <div style=\"background: #121b16; border: 1px solid #3ddc84; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; color: #3ddc84; font-weight: 700; word-break: break-all; line-height: 1.5;\">pitchfootball.com.au/join/riverside&middot;4Kp9</div>\n      <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; margin-top: 8px;\">Good for 14 days &middot; any number of coaches</div>\n    </div>\n  </div>\n  <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Copy the link</div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">What happens when they use it</div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">They pick their own squads. You approve which ones before it counts.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Riverside FC appears on their coach CV, confirmed by you.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e34948\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M6 6 L18 18 M18 6 L6 18\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">They see nothing about any player until you confirm their check, separately.</div></div>\n  </div>\n  <div style=\"height: 1px; background: #24322a;\"></div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">Waiting on you</div>\n    <div style=\"background: #121b16; border: 1px solid #eda100; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"display: flex; align-items: center; gap: 12px;\"><div style=\"width: 40px; height: 40px; border-radius: 12px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 900; font-size: 13px; color: #b9c8bf;\">TR</div><div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\"><div style=\"font-size: 14.5px; font-weight: 800; color: #eef5f0;\">Tom Reilly</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Says he coaches U14 Boys &middot; asked 26 Aug</div></div></div>\n      <div style=\"display: flex; gap: 8px; margin-top: 12px;\"><div style=\"flex: 1; background: #3ddc84; color: #06130c; border-radius: 14px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800;\">He does coach here</div><div style=\"flex: 1; border: 1px solid #24322a; color: #b9c8bf; border-radius: 12px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;\">He doesn&rsquo;t</div></div>\n    </div>\n  </div>\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 10px;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7.5 v5\"></path><circle cx=\"12\" cy=\"16.2\" r=\"0.6\" fill=\"#7d8f85\"></circle></svg><div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">Say no and nothing is sent to him beyond the fact it was not approved. If someone is claiming a squad at your club who should not be, that is worth a phone call rather than a tap.</div></div>\n\n</div>", "title": "NEW — invite a coach, approve a coach", "w": 390}, "ClubUnverified": {"html": "<div style=\"width: 390px; min-height: 1420px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div>\n  <div><div style=\"width: 56px; height: 56px; border-radius: 18px; background: rgba(237, 161, 0, 0.14); display: flex; align-items: center; justify-content: center;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#eda100\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3 l7.5 3 v6 c0 4.5 -3.2 7.8 -7.5 9 c-4.3 -1.2 -7.5 -4.5 -7.5 -9 V6 Z\"></path><path d=\"M12 9 v4\"></path><circle cx=\"12\" cy=\"16\" r=\"0.7\" fill=\"#eda100\"></circle></svg></div></div>\n  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">Claimed &middot; awaiting a call</div>\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -0.015em; color: #eef5f0;\">We need to speak to you first</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Riverside FC is yours. Before any player&rsquo;s details reach you, someone here confirms by phone that the club is real and that you are who you say you are within it.</div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3ddc84;\">What you can do now</div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Your club page is live &mdash; crest, squads, philosophy, pathway.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Post trial notices. They go on the board the same minute.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Add your coaches and administrators.</div></div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">What is switched off until we have spoken</div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e34948\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M6 6 L18 18 M18 6 L6 18\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Anything a player under 18 sends you. It waits, it is not lost, and they are not told you have not been verified.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e34948\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M6 6 L18 18 M18 6 L6 18\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">The Interest Register, even if you have paid.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e34948\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M6 6 L18 18 M18 6 L6 18\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Any way to contact a player or a family.</div></div>\n  </div>\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 13.5px; font-weight: 800; color: #eef5f0;\">Why we do it this way</div>\n    <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.6;\">Paying for something is not proof of who you are. If a card was all it took, anyone who could type a club name would start receiving children&rsquo;s details. <b style=\"color: #eef5f0;\">So a person makes the call, and a person writes down that they made it.</b></div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Where we will call</div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n      <div style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14.5px; color: #eef5f0; font-weight: 700;\">(03) 9xxx xxxx</div>\n      <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; margin-top: 6px;\">The number on Riverside FC&rsquo;s own public listing &mdash; not one you gave us.</div>\n    </div>\n  </div>\n  <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; font-weight: 700; font-size: 14px; border-radius: 14px; height: 46px;\">That number is wrong</div>\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 10px;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7.5 v5\"></path><circle cx=\"12\" cy=\"16.2\" r=\"0.6\" fill=\"#7d8f85\"></circle></svg><div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">Usually same day, always within two business days. If we cannot reach anyone on the club&rsquo;s listed number we will say so rather than leave you waiting.</div></div>\n\n</div>", "title": "3d · NEW — claimed, awaiting your call (D-126)", "w": 390}, "ClubHeldQueue": {"html": "<div style=\"width: 390px; min-height: 1220px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px;\">\n    <div style=\"width: 44px; height: 44px; margin: -11px; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9c8bf\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5 L8 12 l7 7\"></path></svg></div>\n    <div style=\"display: flex; align-items: center; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">Held &middot; awaiting your verification call</div>\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -0.015em; color: #eef5f0;\">Three players are waiting for you</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">They registered interest before we had spoken to you. Nothing is lost and nobody has been turned away.</div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; gap: 12px;\"><div style=\"width: 40px; height: 40px; border-radius: 12px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><rect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"10\" rx=\"2.5\"></rect><path d=\"M8 10.5 V7.5 a4 4 0 0 1 8 0 v3\"></path></svg></div><div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\"><div style=\"font-size: 14.5px; font-weight: 800; color: #7d8f85;\">Name held</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Registered 26 Aug</div></div><div style=\"background: rgba(237, 161, 0, 0.14); color: #eda100; border-radius: 7px; padding: 4px 9px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0;\">Held</div></div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; gap: 12px;\"><div style=\"width: 40px; height: 40px; border-radius: 12px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><rect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"10\" rx=\"2.5\"></rect><path d=\"M8 10.5 V7.5 a4 4 0 0 1 8 0 v3\"></path></svg></div><div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\"><div style=\"font-size: 14.5px; font-weight: 800; color: #7d8f85;\">Name held</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Registered 26 Aug</div></div><div style=\"background: rgba(237, 161, 0, 0.14); color: #eda100; border-radius: 7px; padding: 4px 9px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0;\">Held</div></div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: center; gap: 12px;\"><div style=\"width: 40px; height: 40px; border-radius: 12px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><rect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"10\" rx=\"2.5\"></rect><path d=\"M8 10.5 V7.5 a4 4 0 0 1 8 0 v3\"></path></svg></div><div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\"><div style=\"font-size: 14.5px; font-weight: 800; color: #7d8f85;\">Name held</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Registered 27 Aug</div></div><div style=\"background: rgba(237, 161, 0, 0.14); color: #eda100; border-radius: 7px; padding: 4px 9px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0;\">Held</div></div>\n  </div>\n  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e34948\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M6 6 L18 18 M18 6 L6 18\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">You cannot see who they are, what they wrote, or open a CV.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">They are told their registration is with you. They are not told you are unverified.</div></div>\n    <div style=\"display: flex; align-items: flex-start; gap: 9px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">The moment we have spoken, all three appear in full.</div></div>\n  </div>\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 10px;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7.5 v5\"></path><circle cx=\"12\" cy=\"16.2\" r=\"0.6\" fill=\"#7d8f85\"></circle></svg><div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.55;\">If a family withdraws while a registration is held, it disappears and you never learn it existed. That is the correct outcome and it is the same rule after verification.</div></div>\n  <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; font-weight: 700; font-size: 14px; border-radius: 14px; height: 46px;\">When will you call me?</div>\n\n</div>", "title": "3e · NEW — registrations held until you verify", "w": 390}, "ClubDashboard": {"html": "<div style=\"width: 390px; min-height: 1330px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg><div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div></div>\n  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">Technical director · Sam Okafor</div>\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -0.015em; color: #eef5f0;\">Riverside FC</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Everything your club runs on Pitch.</div>\n  </div>\n    <div style=\"background: rgba(61, 220, 132, 0.07); border: 1px solid #24322a; border-radius: 16px; padding: 13px 14px; display: flex; align-items: center; gap: 11px;\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M12 3 l7.5 3 v6 c0 4.5 -3.2 7.8 -7.5 9 c-4.3 -1.2 -7.5 -4.5 -7.5 -9 V6 Z\"></path><path d=\"M8.8 12 l2.2 2.2 l4.2 -4.4\"></path></svg><div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\"><div style=\"font-size: 13px; font-weight: 800; color: #eef5f0;\">Verified club</div><div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 500;\">Confirmed by phone, 21 August &middot; BUZ</div></div></div>\n\n<div style=\"display: flex; gap: 9px;\"><div style=\"flex: 1; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 4px;\"><div style=\"font-size: 21px; font-weight: 900; color: #eef5f0; line-height: 1;\">34</div><div style=\"font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85; line-height: 1.35;\">On your<br>register</div></div><div style=\"flex: 1; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 4px;\"><div style=\"font-size: 21px; font-weight: 900; color: #eef5f0; line-height: 1;\">6</div><div style=\"font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85; line-height: 1.35;\">New this<br>week</div></div><div style=\"flex: 1; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 4px;\"><div style=\"font-size: 21px; font-weight: 900; color: #eef5f0; line-height: 1;\">2</div><div style=\"font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #7d8f85; line-height: 1.35;\">Trials<br>live</div></div></div>\n  <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 2px 15px;\">\n      <div style=\"display: flex; align-items: center; gap: 13px; padding: 14px 0;\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M4 6 h16 v12 H4 Z M4 7 l8 6 l8 -6\"></path></svg><div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\"><div style=\"font-size: 14.5px; font-weight: 800; color: #eef5f0;\">Interest register</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">34 players · 6 you have not opened</div></div><div style=\"background: rgba(61, 220, 132, 0.14); color: #3ddc84; border-radius: 7px; padding: 4px 9px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0;\">6 new</div><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M9 6 l6 6 l-6 6\"></path></svg></div>\n      <div style=\"height: 1px; background: #24322a;\"></div>\n      <div style=\"display: flex; align-items: center; gap: 13px; padding: 14px 0;\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M8 3 v4 M16 3 v4 M4 10 h16 M5 6 h14 v14 H5 Z\"></path></svg><div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\"><div style=\"font-size: 14.5px; font-weight: 800; color: #eef5f0;\">Trial notices</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">2 live · next one Sun 11 Oct</div></div><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M9 6 l6 6 l-6 6\"></path></svg></div>\n      <div style=\"height: 1px; background: #24322a;\"></div>\n      <div style=\"display: flex; align-items: center; gap: 13px; padding: 14px 0;\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M6 21 V4 M6 4 H17 L15 7 L17 10 H6\"></path></svg><div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\"><div style=\"font-size: 14.5px; font-weight: 800; color: #eef5f0;\">Your club page</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">12 squads · crest, philosophy, pathway</div></div><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M9 6 l6 6 l-6 6\"></path></svg></div>\n      <div style=\"height: 1px; background: #24322a;\"></div>\n      <div style=\"display: flex; align-items: center; gap: 13px; padding: 14px 0;\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M3 5 h18 v14 H3 Z M3 10 h18\"></path></svg><div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\"><div style=\"font-size: 14.5px; font-weight: 800; color: #eef5f0;\">Plan &amp; billing</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">Interest Register · $329/yr inc GST · renews 27 Aug 2027</div></div><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M9 6 l6 6 l-6 6\"></path></svg></div>\n      <div style=\"height: 1px; background: #24322a;\"></div>\n      <div style=\"display: flex; align-items: center; gap: 13px; padding: 14px 0;\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M9 7.5 a3 3 0 1 0 6 0 a3 3 0 1 0 -6 0 M4 20 c0 -4.5 3.5 -7 8 -7 s8 2.5 8 7\"></path></svg><div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\"><div style=\"font-size: 14.5px; font-weight: 800; color: #eef5f0;\">People at your club</div><div style=\"font-size: 12px; color: #7d8f85; font-weight: 500;\">1 technical director · 4 coaches · 2 administrators</div></div><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7d8f85\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M9 6 l6 6 l-6 6\"></path></svg></div>\n  </div>\n  <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Post a trial</div>\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; align-items: flex-start; gap: 11px;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><path d=\"M12 3 l7.5 3 v6 c0 4.5 -3.2 7.8 -7.5 9 c-4.3 -1.2 -7.5 -4.5 -7.5 -9 V6 Z\"></path><path d=\"M8.8 12 l2.2 2.2 l4.2 -4.4\"></path></svg><div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">You are the only role here that reads a player&rsquo;s development record. Your administrators cannot, by any route, and they can see this line too.</div></div>\n\n</div>", "title": "NEW — the club dashboard (home)", "w": 390}, "LandingParent": {"html": "<div style=\"width: 390px; min-height: 1560px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px; padding: 22px 18px 34px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px;\">\n    <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg>\n    <div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div>\n  </div>\n\n  <div style=\"position: relative; overflow: hidden; border-radius: 22px; background: linear-gradient(160deg, #123326 0%, #0c1d14 60%, #0a1510 100%); padding: 26px 20px 24px 20px; display: flex; flex-direction: column; gap: 14px;\">\n    <div style=\"position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #a479e2;\"></div>\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #a479e2;\">For parents</div>\n    <div style=\"font-size: 32px; font-weight: 900; line-height: 1.05; letter-spacing: -0.015em; color: #eef5f0;\">Your kid's football,<br>kept properly.</div>\n    <div style=\"font-size: 14.5px; color: #b9c8bf; font-weight: 500; line-height: 1.6;\">Every season, every club, every goal they were proud of — in one record that belongs to them. Not a spreadsheet on someone's laptop that disappears when the coach does.</div>\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px; margin-top: 4px;\">Set up your child's profile</div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; text-align: center;\">Free for every player under 18.</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3ddc84;\">You hold the keys</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.6;\">This is a record about a child. The controls sit with you.</div>\n\n    <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n      <div style=\"display: flex; align-items: flex-start; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n        <div style=\"width: 34px; height: 34px; border-radius: 11px; background: rgba(61, 220, 132, 0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10.5\" width=\"16\" height=\"10\" rx=\"2.5\"></rect><path d=\"M8 10.5 V7.5 a4 4 0 0 1 8 0 v3\"></path></svg></div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Nothing exists until you say so</div>\n          <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Under 16, nothing your child builds is visible to anyone until you approve it &mdash; not to a club, not to a search, not to us. If you do nothing, it deletes itself in fourteen days.</div>\n        </div>\n      </div>\n\n      <div style=\"display: flex; align-items: flex-start; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n        <div style=\"width: 34px; height: 34px; border-radius: 11px; background: rgba(61, 220, 132, 0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"></circle><path d=\"M20 20 L15.8 15.8\"></path><path d=\"M5 5 L19 19\" stroke=\"#e34948\"></path></svg></div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Under-16s cannot be searched for</div>\n          <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">Not \"hidden by default\". There is no search on Pitch that reaches an under-16 — not for clubs, not for coaches, not for us. It is not a setting that can be switched on.</div>\n        </div>\n      </div>\n\n      <div style=\"display: flex; align-items: flex-start; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n        <div style=\"width: 34px; height: 34px; border-radius: 11px; background: rgba(61, 220, 132, 0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20.5 12.5 a8 8 0 1 0 -3.2 6.4 L21 20 Z\"></path></svg></div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">Nobody messages your child</div>\n          <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">There is no way to send a message to a child on Pitch. If a club wants to talk, it comes to you and your child together, and it is written down.</div>\n        </div>\n      </div>\n\n      <div style=\"display: flex; align-items: flex-start; gap: 12px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n        <div style=\"width: 34px; height: 34px; border-radius: 11px; background: rgba(61, 220, 132, 0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 7 h14\"></path><path d=\"M9.5 7 V5 h5 v2\"></path><path d=\"M6.5 7 l1 12.5 h9 L17.5 7\"></path></svg></div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 14px; font-weight: 800; color: #eef5f0;\">One tap deletes it</div>\n          <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500; line-height: 1.5;\">You or your child, any time, no reason needed. We keep a record that consent was given and withdrawn — nothing else.</div>\n        </div>\n      </div>\n    </div>\n  </div>\n\n  <div style=\"height: 1px; background: #24322a;\"></div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3ddc84;\">What it's actually for</div>\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 14px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 5px;\">\n        <div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">A CV worth sending to a club</div>\n        <div style=\"font-size: 13px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Position, squad number, the clubs they've played for, what they achieved, a couple of clips. Two minutes to build. It looks like something, which matters more at fourteen than anyone admits.</div>\n      </div>\n      <div style=\"height: 1px; background: #24322a;\"></div>\n      <div style=\"display: flex; flex-direction: column; gap: 5px;\">\n        <div style=\"font-size: 15px; font-weight: 800; color: #eef5f0;\">And a way to send it</div>\n        <div style=\"font-size: 13px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Your child asks to send their CV to a club. It comes to you first — you check the address, you press send. The club gets a link you can switch off, not a file that stays in their inbox.</div>\n      </div>\n    </div>\n  </div>\n\n  <div style=\"background: #1a2420; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 13px;\">\n    <div style=\"display: inline-flex; align-items: center; gap: 7px; background: rgba(237, 161, 0, 0.14); border-radius: 999px; padding: 5px 11px; align-self: flex-start;\"><div style=\"width: 6px; height: 6px; border-radius: 999px; background: #eda100;\"></div><div style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #eda100;\">Coming soon</div></div>\n    <div style=\"display: flex; flex-direction: column; gap: 10px;\"><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 700; line-height: 1.45;\">What your child's coach is actually working on with them</div></div><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 700; line-height: 1.45;\">Everything they've done, kept — even when they change clubs</div></div><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 700; line-height: 1.45;\">Game time you don't have to count from the sideline</div></div><div style=\"display: flex; align-items: flex-start; gap: 10px;\"><div style=\"width: 5px; height: 5px; border-radius: 999px; background: #eda100; flex-shrink: 0; margin-top: 7px;\"></div><div style=\"font-size: 13.5px; color: #b9c8bf; font-weight: 700; line-height: 1.45;\">Clubs finding your child when they're old enough</div></div></div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 4px;\">\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Set up your child's profile</div>\n    <div style=\"font-size: 12px; color: #7d8f85; font-weight: 500; text-align: center; line-height: 1.5;\">Australia first · Data stored in Australia<br>Free for every player under 18</div>\n  </div>\n\n</div>", "title": "1 · Landing — parent", "w": 390}, "ParentApprovalV2": {"html": "<div style=\"width: 390px; min-height: 1580px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px;\">\n    <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg>\n    <div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #a479e2;\">Deniz built this and asked you to look</div>\n    <div style=\"font-size: 27px; font-weight: 900; line-height: 1.12; letter-spacing: -0.015em; color: #eef5f0;\">Here's what he made. Approve it?</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Deniz is 14. This is everything on his page. Nothing is live until you say so.</div>\n  </div>\n\n  <div style=\"border: 1.5px solid #3ddc84; border-radius: 20px; padding: 3px; background: rgba(61, 220, 132, 0.05);\">\n    <div style=\"background: #121b16; border-radius: 17px; overflow: hidden;\">\n\n      <div style=\"background: linear-gradient(160deg, #123326 0%, #0c1d14 100%); padding: 18px 16px; display: flex; align-items: center; gap: 13px;\">\n        <div style=\"width: 52px; height: 52px; border-radius: 16px; background: rgba(255, 255, 255, 0.12); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; color: #eef5f0; flex-shrink: 0;\">DY</div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"font-size: 19px; font-weight: 900; color: #eef5f0; letter-spacing: -0.015em;\">Deniz Yılmaz</div>\n          <div style=\"font-size: 12.5px; color: rgba(255, 255, 255, 0.72); font-weight: 500;\">Attacking midfielder · Left wing · #10</div>\n          <div style=\"font-size: 12.5px; color: rgba(255, 255, 255, 0.58); font-weight: 500;\">Riverside FC — U15s · Melbourne VIC</div>\n        </div>\n      </div>\n\n      <div style=\"padding: 15px 16px; display: flex; flex-direction: column; gap: 14px;\">\n\n        <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px;\">\n          <div style=\"background: #1a2420; border-radius: 12px; padding: 9px 4px; display: flex; flex-direction: column; align-items: center; gap: 1px;\"><div style=\"font-size: 18px; font-weight: 900; color: #eef5f0;\">18</div><div style=\"font-size: 8.5px; font-weight: 700; letter-spacing: 0.06em; color: #7d8f85; text-transform: uppercase;\">Apps</div></div>\n          <div style=\"background: #1a2420; border-radius: 12px; padding: 9px 4px; display: flex; flex-direction: column; align-items: center; gap: 1px;\"><div style=\"font-size: 18px; font-weight: 900; color: #3ddc84;\">11</div><div style=\"font-size: 8.5px; font-weight: 700; letter-spacing: 0.06em; color: #7d8f85; text-transform: uppercase;\">Goals</div></div>\n          <div style=\"background: #1a2420; border-radius: 12px; padding: 9px 4px; display: flex; flex-direction: column; align-items: center; gap: 1px;\"><div style=\"font-size: 18px; font-weight: 900; color: #eef5f0;\">7</div><div style=\"font-size: 8.5px; font-weight: 700; letter-spacing: 0.06em; color: #7d8f85; text-transform: uppercase;\">Assists</div></div>\n        </div>\n\n        <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n          <div style=\"font-size: 9.5px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">What he wrote about himself</div>\n          <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">\"Right-footed 10 who plays between the lines. Works between the lines. Still sharpening my weak foot and my pressing triggers.\"</div>\n        </div>\n\n        <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n          <div style=\"font-size: 9.5px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Two clips</div>\n          <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">Season highlights 2026 · vs Northern Utd — full performance</div>\n        </div>\n\n        <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n          <div style=\"font-size: 9.5px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Achievements &amp; other football</div>\n          <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\">U15 League runners up · Players' Player of the Year 2025 · Northcote High 1st XI · Melbourne Futsal U15</div>\n        </div>\n\n        <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; font-weight: 700; font-size: 13px; border-radius: 11px; height: 42px;\">Open the full page</div>\n\n      </div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3ddc84;\">If you approve</div>\n    <div style=\"display: flex; flex-direction: column; gap: 7px;\">\n      <div style=\"display: flex; align-items: flex-start; gap: 10px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n        <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\"><b style=\"color: #eef5f0;\">Deniz will not appear in any search.</b> Under-16 profiles are not searchable on Pitch at all.</div>\n      </div>\n      <div style=\"display: flex; align-items: flex-start; gap: 10px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n        <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\"><b style=\"color: #eef5f0;\">No one can contact Deniz directly.</b> Every approach comes to you and Deniz together.</div>\n      </div>\n      <div style=\"display: flex; align-items: flex-start; gap: 10px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n        <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\"><b style=\"color: #eef5f0;\">You hold the share link.</b> It works only where you send it, expires every 90 days, and you can pause or regenerate it any time.</div>\n      </div>\n      <div style=\"display: flex; align-items: flex-start; gap: 10px; background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px;\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n        <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500; line-height: 1.5;\"><b style=\"color: #eef5f0;\">You see everything he sees.</b> Linked account, full visibility — and you can withdraw all of it at any time.</div>\n      </div>\n    </div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: auto;\">\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Approve this page</div>\n    <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; font-weight: 700; font-size: 14px; border-radius: 13px; height: 48px;\">Not yet — I want to talk to him first</div>\n    <div style=\"font-size: 11.5px; color: #7d8f85; font-weight: 500; text-align: center; line-height: 1.5;\">Approving accepts the Terms &amp; Privacy Policy on Deniz's behalf, and you can undo it any time.<br>If you do nothing, all of this is deleted after 14 days.</div>\n  </div>\n\n</div>", "title": "3 · Approve the page he actually built", "w": 390}, "GuardianHome": {"html": "<div style=\"width: 390px; min-height: 1120px; background: #0b120e; color: #eef5f0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 30px 18px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 8px;\">\n    <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" style=\"flex-shrink: 0;\"><rect width=\"26\" height=\"26\" rx=\"8\" fill=\"#3ddc84\"></rect><rect x=\"5\" y=\"6.5\" width=\"16\" height=\"13\" rx=\"1.5\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></rect><line x1=\"13\" y1=\"6.5\" x2=\"13\" y2=\"19.5\" stroke=\"#06130c\" stroke-width=\"1.6\"></line><circle cx=\"13\" cy=\"13\" r=\"2.7\" fill=\"none\" stroke=\"#06130c\" stroke-width=\"1.6\"></circle></svg>\n    <div style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.02em;\">Pitch</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n    <div style=\"font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -0.015em; color: #eef5f0;\">Your family</div>\n    <div style=\"font-size: 14px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Everything about your children on Pitch, and every control over it, is here.</div>\n  </div>\n\n  <div style=\"background: linear-gradient(160deg, #123326 0%, #0c1d14 100%); border: 1px solid #3ddc84; border-radius: 18px; padding: 17px; display: flex; flex-direction: column; gap: 13px;\">\n    <div style=\"display: flex; align-items: center; gap: 9px;\">\n      <div style=\"width: 8px; height: 8px; border-radius: 999px; background: #3ddc84;\"></div>\n      <div style=\"font-size: 10.5px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3ddc84;\">Waiting on you</div>\n    </div>\n    <div style=\"font-size: 17px; font-weight: 900; color: #eef5f0; line-height: 1.3; letter-spacing: -0.015em;\">Deniz wants to send his CV to Sunbury United</div>\n    <div style=\"font-size: 13px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">Nothing has been sent. Check the address and it goes; do nothing and the request disappears on its own.</div>\n    <div style=\"display: flex; align-items: center; justify-content: center; background: #3ddc84; color: #06130c; font-weight: 800; font-size: 15px; border-radius: 14px; height: 50px;\">Review it</div>\n  </div>\n\n  <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 13px;\">\n    <div style=\"display: flex; align-items: center; gap: 9px;\">\n      <div style=\"width: 8px; height: 8px; border-radius: 999px; background: #a479e2;\"></div>\n      <div style=\"font-size: 10.5px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #a479e2;\">Also waiting on you</div>\n    </div>\n    <div style=\"font-size: 17px; font-weight: 900; color: #eef5f0; line-height: 1.3; letter-spacing: -0.015em;\">Deniz wants to go on Kingsway Rovers&rsquo; register</div>\n    <div style=\"font-size: 13px; color: #b9c8bf; font-weight: 500; line-height: 1.55;\">He&rsquo;s written a line about himself. Read it before it goes &mdash; you can change it.</div>\n    <div style=\"display: flex; align-items: center; justify-content: center; border: 1px solid #24322a; color: #b9c8bf; font-weight: 700; font-size: 14px; border-radius: 14px; height: 46px;\">Read it</div>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 11px;\">\n    <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8f85;\">Your children</div>\n\n    <div style=\"background: #121b16; border: 1px solid #24322a; border-radius: 16px; padding: 15px 14px; display: flex; flex-direction: column; gap: 14px;\">\n      <div style=\"display: flex; align-items: center; gap: 13px;\">\n        <div style=\"width: 52px; height: 52px; border-radius: 16px; background: #1a2420; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 900; font-size: 18px; color: #b9c8bf;\">DY</div>\n        <div style=\"display: flex; flex-direction: column; gap: 3px; flex: 1;\">\n          <div style=\"font-size: 16px; font-weight: 800; color: #eef5f0;\">Deniz Yılmaz · 14</div>\n          <div style=\"font-size: 12.5px; color: #7d8f85; font-weight: 500;\">Riverside FC — U15s</div>\n        </div>\n      </div>\n\n      <div style=\"display: flex; flex-direction: column; gap: 7px;\">\n        <div style=\"display: flex; align-items: center; gap: 9px;\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3ddc84\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M5 12.5 l4.5 4.5 L19 7\"></path></svg>\n          <div style=\"font-size: 12.5px; color: #b9c8bf; font-weight: 500;\">Approved by you on 1 Au
