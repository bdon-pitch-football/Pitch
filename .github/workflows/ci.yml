# Doc 29 §8 — CI. The corpus check asserts the documents agree with each
# other; the build job asserts the site compiles; the static checks assert the
# security posture (service-role key in exactly one file, no committed secrets).
# D-94 §9 (17 Sep): the doc 14 permission suite — THE launch gate — runs on
# every push, with gate coverage, a dependency audit and a secret scan over
# the whole history.
name: CI

on:
  push:
  pull_request:

jobs:
  corpus:
    name: Corpus check (doc 14 §S)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Twelve assertions that the documents agree with each other
        run: python3 scripts/corpus-check.py .

  web:
    name: Build + static security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # D-80: the service-role key bypasses RLS, so it lives in a short,
      # enumerated, server-only list and nowhere else. There are two entries,
      # not one: lib/storage.ts writes uploaded images to Supabase Storage,
      # and a server-side Storage write genuinely needs elevated rights —
      # the anon key is public, so a bucket writable by it is a bucket
      # writable by anyone. Widening the list from one file to two is a
      # deliberate amendment; adding a THIRD is not routine and this check
      # is what makes that visible.
      - name: Service-role key referenced only in its two allowed files (D-80)
        run: |
          set -e
          FILES=$(grep -rl "SUPABASE_SERVICE_ROLE_KEY" --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' app components lib | sort | tr '\n' ' ' | sed 's/ $//' || true)
          echo "Files referencing the service-role key: $FILES"
          if [ "$FILES" != "lib/storage.ts lib/waitlist-db.ts" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY must appear in lib/storage.ts and lib/waitlist-db.ts and nowhere else."
            exit 1
          fi
      - name: No secret ever prefixed NEXT_PUBLIC_
        run: |
          set -e
          if grep -rn "NEXT_PUBLIC_[A-Z_]*\(SECRET\|SERVICE\|KEY\)" --include='*.ts' --include='*.tsx' app components lib | grep -v "NEXT_PUBLIC_SUPABASE_ANON_KEY"; then
            echo "::error::A secret-looking name is prefixed NEXT_PUBLIC_ — that ships it to the client."
            exit 1
          fi
      - name: No .env files committed
        run: |
          set -e
          if git ls-files | grep -E '^\.env($|\.local|\..*\.local)'; then
            echo "::error::A .env file is committed."
            exit 1
          fi
      # D-94 §9: a critical advisory in anything that ships is a stop-work
      # item. Dev-only tooling is left out; so are lower severities, which
      # are reviewed by hand rather than allowed to block every push.
      - name: Dependency audit (critical, shipped packages)
        run: npm audit --omit=dev --audit-level=critical
      - run: npm run typecheck
      # lib/db refuses to load in production without a database address, and
      # the build loads every route. A placeholder is enough: nothing is
      # prerendered from the database (every page renders per request, for
      # the CSP nonce), and the sitemap's query fails soft.
      - run: npm run build
        env:
          SUPABASE_DB_URL: postgres://ci@127.0.0.1:5432/ci

  gate:
    name: Launch gate (doc 14 permission suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 24: the suite imports a TypeScript module directly, which Node runs
      # without a build step from 23.6 on.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Permission suite, against its own in-process Postgres
        run: node scripts/permission-tests.mjs
      - name: Every doc 14 row is pinned by the suite
        run: node scripts/gate-coverage.mjs
      - name: One palette
        run: node scripts/palette-check.mjs

  secrets:
    name: Secret scan (D-94 §1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: The scanner catches what it should
        run: node scripts/secret-scan.mjs --self-test
      - name: No secret in any tracked file
        run: node scripts/secret-scan.mjs
      - name: No secret in any commit ever made
        run: node scripts/secret-scan.mjs --history
